                    onChange={e => setNotes(e.target.value)}
                    placeholder="Temperatures, resting tips, internal probe targets..."
                    className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white"
                  />
                </div>
              </div>

              {/* Cooking Steps & Sticky Add Step Action Header */}
              <div className="space-y-3 pt-2 border-t border-slate-800">
                <div className="sticky top-0 bg-slate-900/95 backdrop-blur-md py-2.5 z-10 border-b border-slate-800/80 flex items-center justify-between">
                  <div>
                    <h4 className="text-sm font-bold text-white">Cooking Steps & Concurrent Sub-Steps ({steps.length})</h4>
                    <p className="text-[11px] text-slate-400">A final 'Serve' step is automatically added at the end.</p>
                  </div>
                  <button
                    type="button"
                    onClick={handleAddStep}
                    className="px-3 py-1.5 rounded-xl bg-orange-500 hover:bg-orange-400 text-slate-950 font-bold text-xs flex items-center gap-1.5 shadow"
                  >
                    <Icon name="plus" className="w-4 h-4" />
                    <span>Add Step</span>
                  </button>
                </div>

                <div className="space-y-3 pt-1">
                  {steps.map((st, sIdx) => {
                    const totalMins = Math.max(1, Number(st.durationMinutes) || 0);
                    const stepHours = Math.floor(totalMins / 60);
                    const stepRemMins = totalMins % 60;

                    return (
                      <div key={st.id || sIdx} className="p-4 rounded-xl bg-slate-950 border border-slate-800 space-y-3">
                        <div className="flex items-center justify-between gap-2">
                          <span className="font-mono text-xs font-bold text-orange-400">
                            Step {sIdx + 1} ({formatDurationHM(totalMins)})
                          </span>
                          <div className="flex items-center gap-1">
                            <button
                              type="button"
                              onClick={() => handleMoveStep(sIdx, -1)}
                              disabled={sIdx === 0}
                              className="px-2 py-1 rounded bg-slate-900 text-slate-400 hover:text-white disabled:opacity-30 text-xs"
                            >
                              ↑
                            </button>
                            <button
                              type="button"
                              onClick={() => handleMoveStep(sIdx, 1)}
                              disabled={sIdx === steps.length - 1}
                              className="px-2 py-1 rounded bg-slate-900 text-slate-400 hover:text-white disabled:opacity-30 text-xs"
                            >
                              ↓
                            </button>
                            {steps.length > 1 && (
                              <button
                                type="button"
                                onClick={() => handleRemoveStep(sIdx)}
                                className="px-2 py-1 rounded bg-slate-900 text-rose-400 hover:bg-rose-950 text-xs"
                              >
                                Remove
                              </button>
                            )}
                          </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-12 gap-3">
                          <div className="sm:col-span-5">
                            <label className="block text-[10px] font-mono uppercase text-slate-400 mb-1">Step Action / Title</label>
                            <input
                              type="text"
                              required
                              value={st.title}
                              onChange={e => handleStepChange(sIdx, 'title', e.target.value)}
                              placeholder="e.g. Main roast in oven"
                              className="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white"
                            />
                          </div>

                          <div className="sm:col-span-3">
                            <label className="block text-[10px] font-mono uppercase text-slate-400 mb-1">Duration (Hrs & Mins)</label>
                            <div className="flex items-center gap-1.5">
                              <div className="flex items-center bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 flex-1">
                                <input
                                  type="number"
                                  min="0"
                                  max="24"
                                  value={stepHours}
                                  onChange={e => handleStepDurationHMChange(sIdx, e.target.value, stepRemMins)}
                                  className="w-full bg-transparent font-mono text-xs text-orange-400 font-bold focus:outline-none text-center"
                                />
                                <span className="text-[10px] font-mono text-slate-400 ml-0.5">h</span>
                              </div>
                              <div className="flex items-center bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 flex-1">
                                <input
                                  type="number"
                                  min="0"
                                  max="59"
                                  value={stepRemMins}
                                  onChange={e => handleStepDurationHMChange(sIdx, stepHours, e.target.value)}
                                  className="w-full bg-transparent font-mono text-xs text-orange-400 font-bold focus:outline-none text-center"
                                />
                                <span className="text-[10px] font-mono text-slate-400 ml-0.5">m</span>
                              </div>
                            </div>
                          </div>

                          <div className="sm:col-span-4">
                            <label className="block text-[10px] font-mono uppercase text-slate-400 mb-1">Oven & Temp (°C)</label>
                            <div className="flex items-center gap-1.5">
                              <select
                                value={st.ovenAssignment || 'none'}
                                onChange={e => handleStepChange(sIdx, 'ovenAssignment', e.target.value)}
                                className="flex-1 px-2 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-slate-200"
                              >
                                <option value="oven1">Oven 1</option>
                                <option value="oven2">Oven 2</option>
                                <option value="none">No Oven</option>
                              </select>
                              {(st.ovenAssignment === 'oven1' || st.ovenAssignment === 'oven2') && (
                                <div className="flex items-center bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 w-20">
                                  <input
                                    type="number"
                                    min="80"
                                    max="260"
                                    step="5"
                                    value={st.ovenTempC || 200}
                                    onChange={e => handleStepChange(sIdx, 'ovenTempC', Number(e.target.value))}
                                    className="w-full bg-transparent font-mono text-xs text-orange-300 font-bold focus:outline-none"
                                  />
                                  <span className="text-[10px] font-mono text-slate-400">°C</span>
                                </div>
                              )}
                            </div>
                          </div>
                        </div>

                        <div>
                          <label className="block text-[10px] font-mono uppercase text-slate-400 mb-1">End of Step Instruction (Optional)</label>
                          <input
                            type="text"
                            value={st.endInstruction || ''}
                            onChange={e => handleStepChange(sIdx, 'endInstruction', e.target.value)}
                            placeholder="e.g. Drain, shake vigorously in colander & dust with semolina"
                            className="w-full px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs text-slate-200"
                          />
                        </div>

                        <div className="pl-3 border-l-2 border-orange-500/40 space-y-2 pt-1">
                          <div className="flex items-center justify-between">
                            <span className="text-[11px] font-mono text-orange-300">
                              Concurrent Sub-Steps ({(st.subSteps || []).length}) — aligned to finish together
                            </span>
                            <button
                              type="button"
                              onClick={() => handleAddSubStep(sIdx)}
                              className="text-xs text-orange-400 hover:underline font-semibold"
                            >
                              + Add Concurrent Sub-Step
                            </button>
                          </div>

                          {(st.subSteps || []).map((sub, subIdx) => {
                            const subTotal = Math.max(1, Number(sub.durationMinutes) || 0);
                            const subH = Math.floor(subTotal / 60);
                            const subM = subTotal % 60;

                            return (
                              <div key={sub.id || subIdx} className="flex flex-wrap sm:flex-nowrap items-center gap-2">
                                <span className="font-mono text-xs text-orange-400 shrink-0">
                                  {sIdx + 1}{String.fromCharCode(97 + subIdx)}:
                                </span>
                                <input
                                  type="text"
                                  value={sub.title}
                                  onChange={e => handleSubStepChange(sIdx, subIdx, 'title', e.target.value)}
                                  placeholder="Concurrent task title..."
                                  className="flex-1 min-w-[160px] px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white"
                                />
                                <div className="flex items-center gap-1 shrink-0">
                                  <div className="flex items-center bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 w-14">
                                    <input
                                      type="number"
                                      min="0"
                                      max="24"
                                      value={subH}
                                      onChange={e => handleSubStepDurationHMChange(sIdx, subIdx, e.target.value, subM)}
                                      className="w-full bg-transparent font-mono text-xs text-orange-300 text-center focus:outline-none"
                                    />
                                    <span className="text-[10px] font-mono text-slate-400">h</span>
                                  </div>
                                  <div className="flex items-center bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 w-16">
                                    <input
                                      type="number"
                                      min="0"
                                      max="59"
                                      value={subM}
                                      onChange={e => handleSubStepDurationHMChange(sIdx, subIdx, subH, e.target.value)}
                                      className="w-full bg-transparent font-mono text-xs text-orange-300 text-center focus:outline-none"
                                    />
                                    <span className="text-[10px] font-mono text-slate-400">m</span>
                                  </div>
                                  <button
                                    type="button"
                                    onClick={() => handleRemoveSubStep(sIdx, subIdx)}
                                    className="p-1.5 text-slate-400 hover:text-rose-400"
                                  >
                                    <Icon name="x" className="w-4 h-4" />
                                  </button>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            <div className="flex gap-3 pt-3 border-t border-slate-800 bg-slate-900 shrink-0">
              <button type="button" onClick={onClose} className="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-semibold text-sm">Cancel</button>
              <button type="submit" className="flex-1 py-2.5 rounded-xl bg-orange-500 hover:bg-orange-400 text-slate-950 font-extrabold text-sm">Save Dish Component</button>
            </div>
          </form>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
