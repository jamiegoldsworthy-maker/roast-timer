                          </span>
                          <span className="text-[10px] font-mono uppercase px-2 py-0.5 rounded-md bg-orange-500/15 text-orange-300 border border-orange-500/30 font-semibold">
                            Simultaneous ({groupSteps.length} Dishes)
                          </span>
                          {isInProgress && (
                            <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-orange-500 text-slate-950 font-bold">
                              ACTIVE
                            </span>
                          )}
                        </div>
                        <span className="text-[11px] text-slate-400 hidden sm:inline">
                          Filter by dish to separate
                        </span>
                      </div>

                      <div className="space-y-3">
                        {groupSteps.map(step => {
                          const isStepAnimating = Boolean(completingIds[step.stepId]);
                          const stepDone = step.completed || isStepAnimating;
                          const isMenuOpen = openStepMenuId === step.stepId;
                          const ovenBadge = formatOvenBadge(step);

                          return (
                            <div
                              key={step.stepId}
                              className={`p-3 rounded-xl border transition-all ${
                                isStepAnimating
                                  ? 'animate-completing-exit bg-orange-500/10 border-orange-500/30'
                                  : step.completed
                                  ? 'bg-slate-950/30 border-slate-800/40 opacity-50'
                                  : 'bg-slate-950/70 border-slate-800/80'
                              }`}
                            >
                              <div className="flex items-start gap-1">
                                <CheckButton
                                  checked={stepDone}
                                  onToggle={() => triggerStepToggle(step)}
                                  label={`Mark "${step.componentName}: ${step.title}" done`}
                                />

                                <div className="flex-1 min-w-0 space-y-1.5">
                                  <div className="flex items-center justify-between gap-2">
                                    <div className="flex flex-wrap items-center gap-2 min-w-0">
                                      <button
                                        onClick={() => setFilterCompId(step.componentId)}
                                        className="text-xs font-semibold text-orange-300 hover:underline truncate"
                                        title="Click to filter & isolate this dish"
                                      >
                                        {step.componentName}
                                      </button>
                                      {!isMinimal && (
                                        <span className="text-[11px] font-mono text-slate-400">
                                          ({formatDurationHM(step.effectiveDurationMinutes)} • ends {formatTimeHHMM(step.endTime)})
                                        </span>
                                      )}
                                      {ovenBadge && (
                                        <span className={`text-[10px] font-mono px-1.5 py-0.5 rounded border ${
                                          ovenBadge.isOven2
                                            ? 'bg-sky-500/15 text-sky-300 border-sky-500/30'
                                            : 'bg-orange-500/15 text-orange-300 border-orange-500/30'
                                        }`}>
                                          {ovenBadge.name} • {ovenBadge.temp}°C
                                        </span>
                                      )}
                                    </div>

                                    <div className="-my-1.5 flex shrink-0 items-center gap-1">
                                      <button
                                        type="button"
                                        onClick={() => onIsolateStep(step)}
                                        aria-label={`Focus on "${step.title}"`}
                                        className="flex min-h-[44px] min-w-[44px] touch-manipulation items-center justify-center gap-1.5 rounded-xl bg-slate-900 px-2.5 text-[11px] font-semibold text-slate-200 hover:bg-slate-800 hover:text-orange-300 active:bg-slate-700"
                                        title="Isolate this step"
                                      >
                                        <Icon name="maximize-2" className="w-3.5 h-3.5 text-orange-400" />
                                        <span className="hidden sm:inline">Isolate</span>
                                      </button>
                                      <button
                                        type="button"
                                        onClick={() => setOpenStepMenuId(isMenuOpen ? null : step.stepId)}
                                        aria-label="Step options"
                                        className={`flex min-h-[44px] min-w-[44px] touch-manipulation items-center justify-center rounded-xl transition ${
                                          isMenuOpen ? 'bg-orange-500/20 text-orange-300' : 'bg-slate-900 text-slate-300 hover:bg-slate-800 hover:text-white'
                                        }`}
                                      >
                                        <Icon name="more-horizontal" className="w-4 h-4" />
                                      </button>
                                    </div>
                                  </div>

                                  <div className={`text-sm font-semibold break-words ${stepDone ? 'line-through text-slate-500' : 'text-slate-100'}`}>
                                    {step.title}
                                  </div>

                                  {step.subSteps && step.subSteps.length > 0 && (
                                    <div className="w-full pt-1 space-y-1.5">
                                      {step.subSteps.map((sub, sIdx) => (
                                        <button
                                          key={sub.id || sIdx}
                                          type="button"
                                          onClick={() => onToggleSubStep(step.stepId, sub.id)}
                                          className={`w-full text-left flex items-start gap-2.5 p-2.5 min-h-[44px] touch-manipulation rounded-xl border transition ${
                                            sub.completed
                                              ? 'bg-slate-950/30 border-slate-800/40 opacity-50'
                                              : 'bg-slate-900/70 border-slate-800/80 hover:border-slate-700'
                                          }`}
                                        >
                                          <span className={`mt-0.5 w-5 h-5 rounded flex items-center justify-center border shrink-0 ${sub.completed ? 'bg-orange-500 border-orange-500 text-slate-950' : 'border-slate-500'}`}>
                                            {sub.completed && <Icon name="check" className="w-3.5 h-3.5 stroke-[3]" />}
                                          </span>
                                          <div className="flex-1 min-w-0 flex flex-col sm:flex-row sm:items-center justify-between gap-1">
                                            <span className={`text-xs break-words ${sub.completed ? 'line-through text-slate-500' : 'text-slate-200'}`}>
                                              <strong className="text-orange-400 font-mono mr-1.5">{step.stepOrder}{String.fromCharCode(97 + sIdx)}:</strong>
                                              {sub.title}
                                            </span>
                                            <span className="font-mono text-[11px] text-slate-400 shrink-0">
                                              {formatTimeHHMM(sub.startTime)} ({formatDurationHM(sub.durationMinutes)})
                                            </span>
                                          </div>
                                        </button>
                                      ))}
                                    </div>
                                  )}

                                  {step.endInstruction && !isMinimal && (
                                    <div className="w-full text-xs text-slate-300 bg-slate-900/80 border border-slate-800 px-2.5 py-1.5 rounded-lg break-words">
                                      <span className="text-orange-400 font-semibold mr-1">Then:</span>
                                      {step.endInstruction}
                                    </div>
                                  )}

                                  {isMenuOpen && (
                                    <StepActionDrawer
                                      step={step}
                                      schedule={schedule}
                                      alertSettings={alertSettings}
                                      onOpenQuickDrawer={onOpenQuickDrawer}
                                      onAdjustStepDuration={onAdjustStepDuration}
                                      onSwitchStepOven={onSwitchStepOven}
                                      onOpenCascadeModal={onOpenCascadeModal}
                                      onUpdateStepAlertConfig={onUpdateStepAlertConfig}
                                      onCloseMenu={() => setOpenStepMenuId(null)}
                                    />
                                  )}
                                </div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                }

                const step = entry.step;
                const isAnimatingOut = Boolean(completingIds[step.stepId]);
                const effectivelyCompleted = step.completed || isAnimatingOut;
                const nowMs = now.getTime();
                const startMs = step.startTime.getTime();
                const endMs = step.endTime.getTime();
                const isInProgress = !effectivelyCompleted && nowMs >= startMs && nowMs <= endMs;
                const isOverdue = !effectivelyCompleted && nowMs > endMs;
                const isMenuOpen = openStepMenuId === step.stepId;
                const ovenBadge = formatOvenBadge(step);

                return (
                  <div
                    key={step.stepId}
                    className={`rounded-2xl border p-4 sm:p-5 transition-all overflow-hidden ${
                      isAnimatingOut
                        ? 'animate-completing-exit bg-orange-500/10 border-orange-500/40'
                        : step.completed
                        ? 'bg-slate-900/30 border-slate-800/40 opacity-45 animate-completed-steady'
                        : step.isPreheatStep
                        ? 'bg-gradient-to-r from-orange-500/10 via-slate-900 to-slate-900 border-orange-500/40'
                        : isInProgress
                        ? 'bg-slate-900 border-orange-500/60 shadow-lg shadow-orange-500/5'
                        : isOverdue
                        ? 'bg-slate-900 border-orange-500/40'
                        : 'bg-slate-900/80 border-slate-800/80 hover:border-slate-700'
                    }`}
                  >
                    <div className="flex items-start gap-1 w-full">
                      <CheckButton
                        checked={effectivelyCompleted}
                        onToggle={() => triggerStepToggle(step)}
                        label={`Mark "${step.title}" done`}
                      />

                      <div className="flex-1 min-w-0 space-y-2">
                        <div className="flex items-center justify-between gap-2">
                          <div className="flex flex-wrap items-center gap-2 min-w-0">
                            <span className="font-mono text-xs font-bold text-orange-400">
                              {isMinimal
                                ? formatTimeHHMM(step.startTime)
                                : `${formatTimeHHMM(step.startTime)} – ${formatTimeHHMM(step.endTime)}`}
                            </span>
                            <span className="text-slate-600">•</span>
                            <span className="text-xs font-medium text-slate-300 truncate">{step.componentName}</span>
                            {!isMinimal && (
                              <span className="text-[11px] font-mono text-slate-500">
                                ({step.isPreheatStep ? 'PREHEAT' : `${step.stepOrder}/${step.totalStepsInComp}`} • {formatDurationHM(step.effectiveDurationMinutes)})
                              </span>
                            )}
                            {ovenBadge && (
                              <span className={`text-[10px] font-mono px-1.5 py-0.5 rounded border ${
                                ovenBadge.isOven2
                                  ? 'bg-sky-500/15 text-sky-300 border-sky-500/30'
                                  : 'bg-orange-500/15 text-orange-300 border-orange-500/30'
                              }`}>
                                {ovenBadge.name} • {ovenBadge.temp}°C
                              </span>
                            )}
                            {step.soloOvenSlot && !isMinimal && (
                              <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-orange-500/15 text-orange-300 border border-orange-500/30">
                                SOLO OVEN
                              </span>
                            )}
                            {isInProgress && (
                              <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-orange-500 text-slate-950 font-bold">
                                ACTIVE
                              </span>
                            )}
                          </div>

                          <div className="-my-1.5 flex shrink-0 items-center gap-1">
                            <button
                              type="button"
                              onClick={() => onIsolateStep(step)}
                              aria-label={`Focus on "${step.title}"`}
                              className="flex min-h-[44px] min-w-[44px] touch-manipulation items-center justify-center gap-1.5 rounded-xl bg-slate-800 px-3 text-xs font-semibold text-slate-100 active:bg-slate-700"
                            >
                              <Icon name="maximize-2" className="h-4 w-4 text-orange-400" />
                              <span className="hidden sm:inline">Isolate</span>
                            </button>
                            <button
                              type="button"
                              onClick={() => setOpenStepMenuId(isMenuOpen ? null : step.stepId)}
                              aria-label="Step options"
                              className={`flex min-h-[44px] min-w-[44px] touch-manipulation items-center justify-center rounded-xl ${
                                isMenuOpen ? 'bg-orange-500/20 text-orange-200' : 'bg-slate-800 text-slate-200'
                              }`}
                            >
                              <Icon name="more-horizontal" className="h-5 w-5" />
                            </button>
                          </div>
                        </div>

                        <h3 className={`text-base font-semibold leading-snug break-words ${effectivelyCompleted ? 'line-through text-slate-500' : 'text-slate-100'}`}>
                          {step.title}
                        </h3>

                        {step.subSteps && step.subSteps.length > 0 && (
                          <div className="w-full pt-1 space-y-1.5">
                            {step.subSteps.map((sub, sIdx) => (
                              <button
                                key={sub.id || sIdx}
                                type="button"
                                onClick={() => onToggleSubStep(step.stepId, sub.id)}
                                className={`w-full text-left flex items-start gap-2.5 p-2.5 min-h-[44px] touch-manipulation rounded-xl border transition ${
                                  sub.completed
                                    ? 'bg-slate-950/30 border-slate-800/40 opacity-50'
                                    : 'bg-slate-950/60 border-slate-800/80 hover:border-slate-700'
                                }`}
                              >
                                <span className={`mt-0.5 w-5 h-5 rounded flex items-center justify-center border shrink-0 ${sub.completed ? 'bg-orange-500 border-orange-500 text-slate-950' : 'border-slate-500'}`}>
                                  {sub.completed && <Icon name="check" className="w-3.5 h-3.5 stroke-[3]" />}
                                </span>
                                <div className="flex-1 min-w-0 flex flex-col sm:flex-row sm:items-center justify-between gap-1">
                                  <span className={`text-xs break-words ${sub.completed ? 'line-through text-slate-500' : 'text-slate-200'}`}>
                                    <strong className="text-orange-400 font-mono mr-1.5">{step.stepOrder}{String.fromCharCode(97 + sIdx)}:</strong>
                                    {sub.title}
                                  </span>
                                  <span className="font-mono text-[11px] text-slate-400 shrink-0">
                                    {formatTimeHHMM(sub.startTime)} ({formatDurationHM(sub.durationMinutes)})
                                  </span>
                                </div>
                              </button>
                            ))}
                          </div>
                        )}

                        {step.endInstruction && (!isMinimal || isInProgress) && (
                          <div className="w-full text-xs text-slate-300 bg-slate-950/50 border border-slate-800/80 px-3 py-2 rounded-xl break-words">
                            <span className="text-orange-400 font-semibold mr-1">Then:</span>
                            {step.endInstruction}
                          </div>
                        )}

                        {isMenuOpen && (
                          <StepActionDrawer
                            step={step}
                            schedule={schedule}
                            alertSettings={alertSettings}
                            onOpenQuickDrawer={onOpenQuickDrawer}
                            onAdjustStepDuration={onAdjustStepDuration}
                            onSwitchStepOven={onSwitchStepOven}
                            onOpenCascadeModal={onOpenCascadeModal}
                            onUpdateStepAlertConfig={onUpdateStepAlertConfig}
                            onCloseMenu={() => setOpenStepMenuId(null)}
                          />
                        )}
                      </div>
                    </div>
                  </div>
                );
              })
            )}
          </div>
        </div>
      );
    }

    function StepActionDrawer({
      step,
      schedule,
      alertSettings,
      onOpenQuickDrawer,
      onAdjustStepDuration,
      onSwitchStepOven,
      onOpenCascadeModal,
      onUpdateStepAlertConfig,
      onCloseMenu
    }) {
      return (
        <div className="w-full pt-2.5 mt-2 border-t border-slate-800/80 space-y-2.5">
          {!step.isPreheatStep && (
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div className="flex flex-wrap items-center gap-2">
                <button
                  onClick={() => { onOpenQuickDrawer(step.componentId); onCloseMenu(); }}
                  className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-orange-300 flex items-center gap-1.5"
                >
                  <Icon name="clipboard-list" className="w-3.5 h-3.5" />
                  <span>Ingredients & Notes</span>
                </button>
                <button
                  onClick={() => onAdjustStepDuration(step, -5)}
                  className="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-mono text-slate-300"
                >
                  -5m
                </button>
                <button
                  onClick={() => onAdjustStepDuration(step, 5)}
                  className="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-mono text-orange-300"
                >
                  +5m
                </button>
                <button
                  onClick={() => { onOpenCascadeModal(step); onCloseMenu(); }}
                  className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-200 flex items-center gap-1.5"
                >
                  <Icon name="git-branch" className="w-3.5 h-3.5 text-orange-400" />
                  <span>Cascade Delay</span>
                </button>
              </div>

              <div className="flex items-center gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800 text-[11px]">
                <span className="font-mono text-slate-400 px-1.5">Oven:</span>
                <button
                  onClick={() => onSwitchStepOven(step, 'oven1')}
                  className={`px-2 py-1 rounded-lg font-medium transition ${
                    step.ovenAssignment === 'oven1' ? 'bg-orange-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  {schedule.ovenConfig?.oven1?.name || 'Oven 1'}
                </button>
                {schedule.ovenConfig?.oven2?.enabled && (
                  <button
                    onClick={() => onSwitchStepOven(step, 'oven2')}
                    className={`px-2 py-1 rounded-lg font-medium transition ${
                      step.ovenAssignment === 'oven2' ? 'bg-sky-400 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    {schedule.ovenConfig?.oven2?.name || 'Oven 2'}
                  </button>
                )}
                <button
                  onClick={() => onSwitchStepOven(step, 'none')}
                  className={`px-2 py-1 rounded-lg font-medium transition ${
                    (!step.ovenAssignment || step.ovenAssignment === 'none') ? 'bg-slate-800 text-slate-200 font-bold' : 'text-slate-500 hover:text-white'
                  }`}
                >
                  Hob / None
                </button>
              </div>
            </div>
          )}

          <div className="p-2.5 rounded-xl bg-slate-950/80 border border-slate-800/80 flex flex-wrap items-center justify-between gap-2 text-xs">
            <span className="text-slate-400 font-mono text-[11px]">Step Alerts:</span>
            <div className="flex flex-wrap items-center gap-3">
              <div className="flex items-center gap-1.5">
                <button
                  onClick={() => {
                    const cur = step.notifyOverride !== null ? step.notifyOverride : alertSettings.notificationsEnabled;
                    onUpdateStepAlertConfig(step.stepId, { notifyOverride: !cur });
                  }}
                  className={`px-2 py-1 rounded text-[11px] font-medium ${
                    (step.notifyOverride !== null ? step.notifyOverride : alertSettings.notificationsEnabled)
                      ? 'bg-orange-500/20 text-orange-300 border border-orange-500/30'
                      : 'bg-slate-900 text-slate-500'
                  }`}
                >
                  Popup: {(step.notifyOverride !== null ? step.notifyOverride : alertSettings.notificationsEnabled) ? 'ON' : 'OFF'}
                </button>
                <select
                  value={step.notifyLeadSecOverride !== null ? step.notifyLeadSecOverride : alertSettings.notificationLeadSeconds}
                  onChange={e => onUpdateStepAlertConfig(step.stepId, { notifyLeadSecOverride: Number(e.target.value) })}
                  className="bg-slate-900 border border-slate-800 rounded px-2 py-1 font-mono text-[11px] text-orange-300"
                >
                  {LEAD_TIME_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                </select>
              </div>

              <div className="flex items-center gap-1.5">
                <button
                  onClick={() => {
                    const cur = step.alarmOverride !== null ? step.alarmOverride : alertSettings.alarmEnabled;
                    onUpdateStepAlertConfig(step.stepId, { alarmOverride: !cur });
                  }}
                  className={`px-2 py-1 rounded text-[11px] font-medium ${
                    (step.alarmOverride !== null ? step.alarmOverride : alertSettings.alarmEnabled)
                      ? 'bg-orange-500/20 text-orange-300 border border-orange-500/30'
                      : 'bg-slate-900 text-slate-500'
                  }`}
                >
                  Alarm: {(step.alarmOverride !== null ? step.alarmOverride : alertSettings.alarmEnabled) ? 'ON' : 'OFF'}
                </button>
                <select
                  value={step.alarmLeadSecOverride !== null ? step.alarmLeadSecOverride : alertSettings.alarmLeadSeconds}
                  onChange={e => onUpdateStepAlertConfig(step.stepId, { alarmLeadSecOverride: Number(e.target.value) })}
                  className="bg-slate-900 border border-slate-800 rounded px-2 py-1 font-mono text-[11px] text-orange-300"
                >
                  {LEAD_TIME_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                </select>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function IsolateStepModal({
      step,
      now,
      onClose,
      onToggleStepComplete,
      onToggleSubStep,
      onAdjustStepDuration,
      onOpenQuickDrawer,
      onOpenCascadeModal
    }) {
      const remSeconds = Math.max(0, Math.floor((step.endTime.getTime() - now.getTime()) / 1000));
      const mins = Math.floor(remSeconds / 60);
      const secs = remSeconds % 60;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4" onClick={onClose}>
          <div
            className="w-full max-w-lg bg-slate-900 border border-slate-700 rounded-3xl p-6 sm:p-7 space-y-5 shadow-2xl"
            onClick={e => e.stopPropagation()}
          >
            <div className="flex items-start justify-between gap-3 border-b border-slate-800 pb-4">
              <div>
                <span className="text-xs font-mono uppercase text-orange-400">
                  Focused Step • {step.componentName} ({step.stepOrder}/{step.totalStepsInComp})
                </span>
                <h2 className={`text-xl sm:text-2xl font-bold mt-1 ${step.completed ? 'line-through text-slate-500' : 'text-white'}`}>
                  {step.title}
                </h2>
              </div>
              <button
                onClick={onClose}
                className="p-2 rounded-xl bg-slate-800 text-slate-400 hover:text-white"
              >
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <div className="p-4 rounded-2xl bg-slate-950 border border-slate-800 flex items-center justify-between">
              <div>
                <div className="text-[11px] font-mono uppercase text-slate-400">Scheduled Window</div>
                <div className="font-mono text-lg font-bold text-white mt-0.5">
                  {formatTimeHHMM(step.startTime)} – {formatTimeHHMM(step.endTime)}
                </div>
                <div className="text-xs text-slate-400">{formatDurationHM(step.effectiveDurationMinutes)} total</div>
              </div>
              <div className="text-right">
                <div className="text-[11px] font-mono uppercase text-slate-400">Time Remaining</div>
                <div className="font-mono text-3xl font-extrabold text-orange-400">
                  {step.completed ? 'DONE' : `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`}
                </div>
              </div>
            </div>

            {step.subSteps && step.subSteps.length > 0 && (
              <div className="space-y-2">
                <div className="text-xs font-mono uppercase text-slate-400">Concurrent Sub-Steps</div>
                {step.subSteps.map((sub, sIdx) => (
                  <button
                    key={sub.id || sIdx}
                    onClick={() => onToggleSubStep(step.stepId, sub.id)}
                    className={`w-full text-left flex items-start gap-3 p-3 rounded-xl border transition ${
                      sub.completed ? 'bg-slate-950/40 border-slate-800 opacity-50' : 'bg-slate-950 border-slate-800 hover:border-orange-500/40'
                    }`}
                  >
                    <span className={`mt-0.5 w-5 h-5 rounded-md flex items-center justify-center border shrink-0 ${sub.completed ? 'bg-orange-500 border-orange-500 text-slate-950' : 'border-slate-600'}`}>
                      {sub.completed && <Icon name="check" className="w-3.5 h-3.5 stroke-[3]" />}
                    </span>
                    <div className="flex-1 min-w-0">
                      <div className={`text-sm font-medium break-words ${sub.completed ? 'line-through text-slate-500' : 'text-slate-100'}`}>
                        <strong className="text-orange-400 font-mono mr-1.5">{step.stepOrder}{String.fromCharCode(97 + sIdx)}:</strong>
                        {sub.title}
                      </div>
                      <div className="text-xs font-mono text-slate-400 mt-0.5">
                        {formatTimeHHMM(sub.startTime)} – {formatTimeHHMM(sub.endTime)} ({formatDurationHM(sub.durationMinutes)})
                      </div>
                    </div>
                  </button>
                ))}
              </div>
            )}

            {step.endInstruction && (
              <div className="p-3.5 rounded-2xl bg-slate-950 border border-slate-800 text-xs text-slate-200 leading-relaxed">
                <strong className="text-orange-400 block mb-0.5">At end of step:</strong>
                {step.endInstruction}
              </div>
            )}

            <div className="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-800">
              <div className="flex items-center gap-1.5">
                <button
                  onClick={() => onAdjustStepDuration(step, -5)}
                  className="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-mono font-semibold text-slate-200"
                >
                  -5m
                </button>
                <button
                  onClick={() => onAdjustStepDuration(step, 5)}
                  className="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-mono font-semibold text-orange-300"
                >
                  +5m
                </button>
                <button
                  onClick={() => { onClose(); onOpenCascadeModal(step); }}
                  className="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200"
                >
                  Cascade
                </button>
                <button
                  onClick={() => { onClose(); onOpenQuickDrawer(step.componentId); }}
                  className="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-orange-300"
                >
                  Notes & Ingr.
                </button>
              </div>

              <button
                onClick={() => { onToggleStepComplete(step); onClose(); }}
                className="px-5 py-2.5 rounded-xl bg-orange-500 hover:bg-orange-400 text-slate-950 font-bold text-xs shadow-lg shadow-orange-500/20"
              >
                {step.completed ? 'Mark Incomplete' : '✓ Complete Step'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // SCREEN 2: ITEMS LIBRARY VIEW (WITH CUSTOMIZABLE CATEGORIES & SAMPLE CLEANUP)
    // ============================================================================
    function ItemsLibraryView({
      library,
      categories,
      updateCategories,
      session,
      updateSession,
      updateLibrary,
      ovenConfig,
      hasAnySampleDishes,
      onRemoveBuiltInDefaults,
      onEditComponent,
      onCreateComponent,
      showToast
    }) {
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('ALL');
      const [filterSoloOnly, setFilterSoloOnly] = useState(false);
      const [showCategoryManager, setShowCategoryManager] = useState(false);
      const [newCategoryInput, setNewCategoryInput] = useState('');

      // Merge explicit categories with any categories found on dishes
      const allCategories = useMemo(() => {
        const set = new Set(categories || []);
        library.forEach(item => {
          if (item.category) set.add(item.category);
        });
        return Array.from(set);
      }, [categories, library]);

      const filteredLibrary = useMemo(() => {
        return library.filter(item => {
          const itemCat = item.category || 'Uncategorized';
          if (selectedCategory !== 'ALL' && itemCat !== selectedCategory) return false;
          if (filterSoloOnly && !item.soloOvenSlot) return false;
          if (!searchQuery.trim()) return true;
          const q = searchQuery.toLowerCase();
          const nameMatch = (item.name || '').toLowerCase().includes(q);
          const catMatch = itemCat.toLowerCase().includes(q);
          const ingMatch = (item.ingredients || []).some(i => i.toLowerCase().includes(q));
          const stepMatch = (item.steps || []).some(s => (s.title || '').toLowerCase().includes(q));
          return nameMatch || catMatch || ingMatch || stepMatch;
        });
      }, [library, selectedCategory, searchQuery, filterSoloOnly]);

      const handleDeleteComponent = (comp) => {
        updateLibrary(prev => prev.filter(c => c.id !== comp.id));
        updateSession(prev => ({
          ...prev,
          selectedComponentIds: (prev.selectedComponentIds || []).filter(id => id !== comp.id)
        }));
        showToast(`Deleted "${comp.name}"`);
      };

      const handleDuplicateComponent = (comp) => {
        const copy = {
          ...JSON.parse(JSON.stringify(comp)),
          id: 'comp-' + Date.now(),
          name: `${comp.name} (Copy)`
        };
        updateLibrary(prev => [...prev, copy]);
        showToast(`Duplicated "${comp.name}"`);
      };

      const handleAddCategory = (e) => {
        e.preventDefault();
        const trimmed = newCategoryInput.trim();
        if (!trimmed) return;
        if (allCategories.includes(trimmed)) {
          showToast('Category already exists');
          return;
        }
        updateCategories(prev => [...prev, trimmed]);
        setNewCategoryInput('');
        showToast(`Added category "${trimmed}"`);
      };

      const handleDeleteCategory = (catToDelete) => {
        updateCategories(prev => prev.filter(c => c !== catToDelete));
        if (selectedCategory === catToDelete) setSelectedCategory('ALL');
        showToast(`Removed category "${catToDelete}"`);
      };

      return (
        <div className="space-y-5">
          {/* Sticky Top Action Bar */}
          <div className="sticky z-20 bg-[#090d16]/95 backdrop-blur-md py-2.5 border-b border-slate-800/80 flex flex-wrap items-center justify-between gap-3" style={STICKY_TOP}>
            <div>
              <span className="text-[11px] font-mono uppercase text-orange-400">Screen 2 • Reusable Components</span>
              <h2 className="text-xl font-extrabold text-white">Items Library ({library.length})</h2>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={() => setShowCategoryManager(!showCategoryManager)}
                className={`px-3 py-2 rounded-xl text-xs font-bold border flex items-center gap-1.5 transition ${
                  showCategoryManager
                    ? 'bg-orange-500/20 border-orange-500/40 text-orange-300'
                    : 'bg-slate-900 hover:bg-slate-800 border-slate-800 text-slate-300'
                }`}
              >
                <Icon name="tag" className="w-3.5 h-3.5 text-orange-400" />
                <span>Categories ({allCategories.length})</span>
              </button>
              <button
                onClick={() => onCreateComponent(selectedCategory)}
                className="px-4 py-2 rounded-xl bg-orange-500 hover:bg-orange-400 text-slate-950 font-extrabold text-xs flex items-center gap-1.5 shadow-lg shadow-orange-500/20"
              >
                <Icon name="plus" className="w-4 h-4" />
                <span>New Dish Component</span>
              </button>
            </div>
          </div>

          {/* Customizable Categories Manager Drawer */}
          {showCategoryManager && (
            <div className="bg-slate-900 border border-orange-500/30 rounded-2xl p-4 space-y-3 shadow-xl">
              <div className="flex items-center justify-between">
                <div>
                  <h3 className="text-xs font-bold text-white uppercase font-mono">Manage Custom Categories</h3>
                  <p className="text-[11px] text-slate-400">Add or remove categories (e.g. Meat, Veg, Potatoes, Sides). Saved automatically in backups & cloud sync.</p>
                </div>
                <button onClick={() => setShowCategoryManager(false)} className="text-slate-400 hover:text-white">
                  <Icon name="x" className="w-4 h-4" />
                </button>
              </div>

              <form onSubmit={handleAddCategory} className="flex gap-2">
                <input
                  type="text"
                  value={newCategoryInput}
                  onChange={e => setNewCategoryInput(e.target.value)}
                  placeholder="New category name (e.g. Starters, Stuffing, Desserts)..."
                  className="flex-1 px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white focus:border-orange-500 focus:outline-none"
                />
                <button
                  type="submit"
                  className="px-3.5 py-1.5 rounded-xl bg-orange-500 hover:bg-orange-400 text-slate-950 font-bold text-xs"
                >
                  + Add Category
                </button>
              </form>

              <div className="flex flex-wrap gap-1.5 pt-1">
                {allCategories.map(cat => (
                  <span
                    key={cat}
                    className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-slate-950 border border-slate-800 text-xs text-slate-200"
                  >
                    <span>{cat}</span>
                    <button
                      type="button"
                      onClick={() => handleDeleteCategory(cat)}
                      className="text-slate-500 hover:text-rose-400 font-bold"
                      title={`Remove "${cat}" category`}
                    >
                      ×
                    </button>
                  </span>
                ))}
              </div>
            </div>
          )}

          {/* Search, Category Filter Pills & Remove Defaults Banner */}
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 shadow-xl">
            <div className="flex flex-col sm:flex-row gap-2.5">
              <div className="relative flex-1">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  placeholder="Search dishes, categories, ingredients, or steps..."
                  className="w-full pl-9 pr-4 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white placeholder-slate-500"
                />
                <span className="absolute left-3 top-2.5 text-slate-500">
                  <Icon name="search" className="w-4 h-4" />
                </span>
              </div>
              <button
                onClick={() => setFilterSoloOnly(!filterSoloOnly)}
                className={`px-3.5 py-2 rounded-xl text-xs font-semibold border flex items-center gap-2 shrink-0 ${
                  filterSoloOnly ? 'bg-orange-500/20 border-orange-500/40 text-orange-300' : 'bg-slate-950 border-slate-800 text-slate-400'
                }`}
              >
                <Icon name="flame" className="w-4 h-4" />
                <span>Solo Oven Slot Only</span>
              </button>
            </div>

            {/* Category Filter Pills */}
            <div className="flex items-center gap-1.5 overflow-x-auto pb-1">
              <button
                onClick={() => setSelectedCategory('ALL')}
                className={`px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 border transition ${
                  selectedCategory === 'ALL'
                    ? 'bg-orange-500 text-slate-950 border-orange-500'
                    : 'bg-slate-950 border-slate-800 text-slate-400 hover:text-white'
                }`}
              >
                All ({library.length})
              </button>
              {allCategories.map(cat => {
                const count = library.filter(i => (i.category || 'Uncategorized') === cat).length;
                return (
                  <button
                    key={cat}
                    onClick={() => setSelectedCategory(cat)}
                    className={`px-3 py-1.5 rounded-xl text-xs font-semibold shrink-0 border transition ${
                      selectedCategory === cat
                        ? 'bg-orange-500 text-slate-950 border-orange-500 font-bold'
                        : 'bg-slate-950 border-slate-800 text-slate-300 hover:border-slate-700'
                    }`}
                  >
                    {cat} ({count})
                  </button>
                );
              })}
            </div>

            {/* One-Click Permanent Removal of Default Sample Dishes */}
            {hasAnySampleDishes && (
              <div className="pt-2 border-t border-slate-800/80 flex flex-wrap items-center justify-between gap-2">
                <span className="text-[11px] text-slate-400">
                  Ready to use only your own custom dishes? Remove the 5 built-in sample dishes permanently.
                </span>
                <button
                  onClick={onRemoveBuiltInDefaults}
                  className="px-3 py-1 rounded-lg bg-rose-950/50 hover:bg-rose-900/60 border border-rose-500/30 text-rose-300 text-xs font-semibold flex items-center gap-1.5 transition"
                >
                  <Icon name="trash-2" className="w-3.5 h-3.5" />
                  <span>Clear Sample Dishes</span>
                </button>
              </div>
            )}
          </div>

          <div className="grid grid-cols-1 gap-4">
            {filteredLibrary.length === 0 ? (
              <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-10 text-center space-y-3">
                <Icon name="utensils" className="w-8 h-8 text-orange-400 mx-auto" />
                <div className="space-y-1">
                  <h3 className="text-sm font-bold text-white">No dishes found in this view</h3>
                  <p className="text-xs text-slate-400">Click "+ New Dish Component" above to add your own custom roast items.</p>
                </div>
              </div>
            ) : (
              filteredLibrary.map(comp => {
                const pal = COLOR_PALETTE.find(c => c.id === comp.color) || COLOR_PALETTE[0];
                const isSelected = (session.selectedComponentIds || []).includes(comp.id);
                const totalMins = (comp.steps || []).reduce((acc, s) => acc + (Number(s.durationMinutes) || 0), 0);

                return (
                  <div key={comp.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-lg">
                    <div className="flex flex-wrap items-start justify-between gap-3">
                      <div className="space-y-1">
                        <div className="flex flex-wrap items-center gap-2">
                          <span className={`px-2.5 py-0.5 rounded-lg text-xs font-bold border flex items-center gap-1.5 ${pal.badge}`}>
                            <span className={`w-2 h-2 rounded-full ${pal.dot}`} />
                            <span>{comp.name}</span>
                          </span>
                          <span className="px-2 py-0.5 rounded-lg text-[11px] font-mono bg-slate-950 text-orange-300 border border-slate-800">
                            {comp.category || 'Uncategorized'}
                          </span>
                          <span className="font-mono text-xs text-slate-400 bg-slate-950 px-2.5 py-0.5 rounded-lg border border-slate-800">
                            {formatDurationHM(totalMins)} total • {(comp.steps || []).length} steps
                          </span>
                          {comp.soloOvenSlot && (
                            <span className="px-2.5 py-0.5 rounded-lg text-xs font-mono font-bold bg-orange-500/20 text-orange-300 border border-orange-500/40">
                              SOLO OVEN SLOT
                            </span>
                          )}
                        </div>
                        {comp.notes && (
                          <p className="text-xs text-slate-300 leading-relaxed pt-1">{comp.notes}</p>
                        )}
                      </div>

                      <div className="flex flex-wrap items-center gap-2">
                        <button
                          onClick={() => {
                            const next = isSelected
                              ? (session.selectedComponentIds || []).filter(id => id !== comp.id)
                              : [...(session.selectedComponentIds || []), comp.id];
                            updateSession(prev => ({ ...prev, selectedComponentIds: next }));
                          }}
                          className={`px-3 py-1.5 rounded-xl text-xs font-bold border transition ${
                            isSelected
                              ? 'bg-orange-500 text-slate-950 border-orange-500'
                              : 'bg-slate-950 border-slate-700 text-slate-200 hover:border-orange-400'
                          }`}
                        >
                          {isSelected ? '✓ In Active Roast' : '+ Add to Active Roast'}
                        </button>
                        <button
                          onClick={() => onEditComponent(comp)}
                          className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-orange-300 flex items-center gap-1.5"
                        >
                          <Icon name="edit-3" className="w-3.5 h-3.5" />
                          <span>Edit Steps & Details</span>
                        </button>
                        <button
                          onClick={() => handleDuplicateComponent(comp)}
                          className="p-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300"
                          title="Duplicate Dish"
                        >
                          <Icon name="copy" className="w-4 h-4" />
                        </button>
                        <button
                          onClick={() => handleDeleteComponent(comp)}
                          className="p-1.5 rounded-xl bg-slate-800 hover:bg-rose-950 text-slate-400 hover:text-rose-400"
                          title="Delete Dish"
                        >
                          <Icon name="trash-2" className="w-4 h-4" />
                        </button>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-3 border-t border-slate-800/80">
                      <div>
                        <h4 className="text-[11px] font-mono uppercase text-slate-400 mb-2">Ingredients ({(comp.ingredients || []).length})</h4>
                        <ul className="space-y-1">
                          {(comp.ingredients || []).map((ing, i) => (
                            <li key={i} className="text-xs text-slate-300 flex items-center gap-2">
                              <span className="w-1.5 h-1.5 rounded-full bg-orange-400 shrink-0" />
                              <span>{ing}</span>
                            </li>
                          ))}
                        </ul>
                      </div>

                      <div>
                        <h4 className="text-[11px] font-mono uppercase text-slate-400 mb-2">Cooking Steps ({(comp.steps || []).length})</h4>
                        <ol className="space-y-2">
                          {[...(comp.steps || [])].sort((a, b) => (a.order || 0) - (b.order || 0)).map((st, sIdx) => (
                            <li key={st.id || sIdx} className="p-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs space-y-1">
                              <div className="flex items-center justify-between gap-2">
                                <span className="font-bold text-slate-200">{sIdx + 1}. {st.title}</span>
                                <div className="flex items-center gap-1.5 shrink-0">
                                  {st.ovenAssignment && st.ovenAssignment !== 'none' && (
                                    <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-orange-500/15 text-orange-300">
                                      {st.ovenAssignment === 'oven2' ? (ovenConfig?.oven2?.name || 'Oven 2') : (ovenConfig?.oven1?.name || 'Oven 1')}
                                      {st.ovenTempC ? ` ${st.ovenTempC}°C` : ''}
                                    </span>
                                  )}
                                  <span className="font-mono text-orange-400">{formatDurationHM(st.durationMinutes)}</span>
                                </div>
                              </div>
                              {st.subSteps && st.subSteps.length > 0 && (
                                <div className="pl-2.5 border-l border-orange-500/40 space-y-0.5 pt-1">
                                  {st.subSteps.map((sub, subIdx) => (
                                    <div key={sub.id || subIdx} className="text-[11px] text-slate-400 flex items-center justify-between">
                                      <span>{sIdx + 1}{String.fromCharCode(97 + subIdx)}: {sub.title}</span>
                                      <span className="font-mono text-orange-300">{formatDurationHM(sub.durationMinutes)}</span>
                                    </div>
                                  ))}
                                </div>
                              )}
                              {st.endInstruction && (
                                <div className="text-[11px] text-orange-300/90 pt-0.5">→ {st.endInstruction}</div>
                              )}
                            </li>
                          ))}
                        </ol>
                      </div>
                    </div>
                  </div>
                );
              })
            )}
          </div>
        </div>
      );
    }

    // ============================================================================
    // SCREEN 3: MEAL PLANNER & SAVED MEALS VIEW (GROUPED BY CATEGORY)
    // ============================================================================
    function MealPlannerView({
      session,
      updateSession,
      library,
      categories,
      presets,
      updatePresets,
      schedule,
      onOpenShoppingDrawer,
      onEditComponent,
      onStartCooking,
      showToast
    }) {
      const [presetName, setPresetName] = useState('');
      const [presetDesc, setPresetDesc] = useState('');
      const [plannerCatFilter, setPlannerCatFilter] = useState('ALL');

      const allCategories = useMemo(() => {
        const set = new Set(categories || []);
        library.forEach(item => {
          if (item.category) set.add(item.category);
        });
        return Array.from(set);
      }, [categories, library]);

      const filteredPlannerDishes = useMemo(() => {
        if (plannerCatFilter === 'ALL') return library;
        return library.filter(c => (c.category || 'Uncategorized') === plannerCatFilter);
      }, [library, plannerCatFilter]);

      const handleSaveCurrentAsPreset = (e) => {
        e.preventDefault();
        const validIds = (session.selectedComponentIds || []).filter(id => library.some(c => c.id === id));
        const nameToUse = presetName.trim() || session.mealName || 'Custom Roast Preset';
        const newPreset = {
          id: 'preset-' + Date.now(),
          name: nameToUse,
          description: presetDesc.trim() || `${validIds.length} dishes • Target ${session.targetServeTime}`,
          targetServeTime: session.targetServeTime || '14:30',
          componentIds: validIds
        };
        updatePresets(prev => [newPreset, ...prev]);
        setPresetName('');
        setPresetDesc('');
        showToast(`Saved meal preset "${nameToUse}"`);
      };

      const handleLoadPreset = (preset) => {
        const validIds = (preset.componentIds || []).filter(id => library.some(c => c.id === id));
        updateSession(prev => ({
          ...prev,
          mealName: preset.name,
          targetServeTime: preset.targetServeTime || prev.targetServeTime,
          selectedComponentIds: validIds,
          stepStates: {}
        }));
        showToast(`Loaded "${preset.name}"`);
      };

      const handleDeletePreset = (presetId) => {
        updatePresets(prev => prev.filter(p => p.id !== presetId));
        showToast('Deleted saved preset');
      };

      return (
        <div className="space-y-6">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-xl">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <div>
                <span className="text-xs font-mono uppercase text-orange-400">Screen 3 • Meal Coordinator</span>
                <h2 className="text-2xl font-extrabold text-white mt-0.5">Meal Planner & Saved Meals</h2>
                <p className="text-xs text-slate-400 mt-0.5">Assemble today's menu, save or load full roast presets, and inspect your consolidated prep list.</p>
              </div>
              <div className="flex items-center gap-2">
                <button
                  onClick={onOpenShoppingDrawer}
                  className="px-3.5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200 flex items-center gap-2"
                >
                  <Icon name="shopping-bag" className="w-4 h-4 text-orange-400" />
                  <span>Shopping & Prep List</span>
                </button>
                <button
                  onClick={onStartCooking}
                  className="px-4 py-2.5 rounded-xl bg-orange-500 hover:bg-orange-400 text-slate-950 font-extrabold text-xs flex items-center gap-2 shadow-lg shadow-orange-500/20"
                >
                  <Icon name="play" className="w-4 h-4" />
                  <span>Start Cooking Session</span>
                </button>
              </div>
            </div>
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-xl">
            <h3 className="font-bold text-lg text-white flex items-center gap-2">
              <Icon name="bookmark" className="w-5 h-5 text-orange-400" />
              <span>Saved Meal Presets ({presets.length})</span>
            </h3>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              {presets.map(preset => {
                const dishNames = (preset.componentIds || [])
                  .map(id => library.find(c => c.id === id)?.name)
                  .filter(Boolean);

                return (
                  <div key={preset.id} className="p-4 rounded-xl bg-slate-950 border border-slate-800 flex flex-col justify-between gap-3">
                    <div className="space-y-1.5">
                      <div className="flex items-center justify-between gap-2">
                        <h4 className="font-bold text-sm text-white">{preset.name}</h4>
                        <span className="font-mono text-xs text-orange-400 bg-orange-500/10 px-2 py-0.5 rounded border border-orange-500/30">
                          Serve {preset.targetServeTime}
                        </span>
                      </div>
                      <p className="text-xs text-slate-400">{preset.description}</p>
                      <div className="flex flex-wrap gap-1 pt-1">
                        {dishNames.map((n, i) => (
                          <span key={i} className="text-[11px] px-2 py-0.5 rounded bg-slate-900 border border-slate-800 text-slate-300">
                            {n}
                          </span>
                        ))}
                      </div>
                    </div>

                    <div className="flex items-center gap-2 pt-2 border-t border-slate-900">
                      <button
                        onClick={() => handleLoadPreset(preset)}
                        className="flex-1 py-2 rounded-lg bg-orange-500 hover:bg-orange-400 text-slate-950 font-bold text-xs"
                      >
                        Load This Meal
                      </button>
                      <button
                        onClick={() => handleDeletePreset(preset.id)}
                        className="p-2 rounded-lg bg-slate-900 hover:bg-rose-950 text-slate-400 hover:text-rose-400"
                        title="Delete Preset"
                      >
                        <Icon name="trash-2" className="w-4 h-4" />
                      </button>
                    </div>
                  </div>
                );

    function ComponentEditorModal({ component, categories, onAddCategory, onClose, onSave }) {
      const [name, setName] = useState(component.name || '');
      const [category, setCategory] = useState(component.category || (categories && categories[0]) || 'Meat');
      const [isAddingCustomCat, setIsAddingCustomCat] = useState(false);
      const [customCatName, setCustomCatName] = useState('');
      const [color, setColor] = useState(component.color || 'orange');
      const [soloOvenSlot, setSoloOvenSlot] = useState(Boolean(component.soloOvenSlot));
      const [defaultOven, setDefaultOven] = useState(component.defaultOven || 'oven1');
      const [ingredientsText, setIngredientsText] = useState((component.ingredients || []).join('\n'));
      const [notes, setNotes] = useState(component.notes || '');
      const [steps, setSteps] = useState(() => {
        const initial = component.steps && component.steps.length > 0
          ? JSON.parse(JSON.stringify(component.steps))
          : [{ id: 'step-' + Date.now(), title: '', durationMinutes: 20, order: 1, ovenAssignment: 'oven1', ovenTempC: 200, subSteps: [], endInstruction: '' }];
        return initial.sort((a, b) => (a.order || 0) - (b.order || 0));
      });

      const availableCategories = useMemo(() => {
        const set = new Set(categories || DEFAULT_CATEGORIES);
        if (category) set.add(category);
        return Array.from(set);
      }, [categories, category]);

      const handleCreateCustomCategory = () => {
        const trimmed = customCatName.trim();
        if (!trimmed) return;
        if (onAddCategory) onAddCategory(trimmed);
        setCategory(trimmed);
        setCustomCatName('');
        setIsAddingCustomCat(false);
      };

      const handleAddStep = () => {
        setSteps(prev => [
          ...prev,
          {
            id: 'step-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
            title: '',
            durationMinutes: 15,
            order: prev.length + 1,
            ovenAssignment: defaultOven || 'oven1',
            ovenTempC: 200,
            subSteps: [],
            endInstruction: ''
          }
        ]);
      };

      const handleRemoveStep = (idx) => {
        setSteps(prev => prev.filter((_, i) => i !== idx).map((s, i) => ({ ...s, order: i + 1 })));
      };

      const handleMoveStep = (idx, dir) => {
        const targetIdx = idx + dir;
        if (targetIdx < 0 || targetIdx >= steps.length) return;
        const copy = [...steps];
        const temp = copy[idx];
        copy[idx] = copy[targetIdx];
        copy[targetIdx] = temp;
        setSteps(copy.map((s, i) => ({ ...s, order: i + 1 })));
      };

      const handleStepChange = (idx, field, value) => {
        setSteps(prev => prev.map((s, i) => i === idx ? { ...s, [field]: value } : s));
      };

      const handleStepDurationHMChange = (idx, hoursVal, minsVal) => {
        const h = Math.max(0, parseInt(hoursVal, 10) || 0);
        const m = Math.max(0, parseInt(minsVal, 10) || 0);
        const total = Math.max(1, h * 60 + m);
        handleStepChange(idx, 'durationMinutes', total);
      };

      const handleAddSubStep = (stepIdx) => {
        setSteps(prev => prev.map((s, i) => {
          if (i !== stepIdx) return s;
          const nextSubs = [
            ...(s.subSteps || []),
            {
              id: 'sub-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5),
              title: '',
              durationMinutes: Math.min(10, Number(s.durationMinutes) || 15)
            }
          ];
          return { ...s, subSteps: nextSubs };
        }));
      };

      const handleSubStepChange = (stepIdx, subIdx, field, value) => {
        setSteps(prev => prev.map((s, i) => {
          if (i !== stepIdx) return s;
          const nextSubs = (s.subSteps || []).map((sub, j) => j === subIdx ? { ...sub, [field]: value } : sub);
          return { ...s, subSteps: nextSubs };
        }));
      };

      const handleSubStepDurationHMChange = (stepIdx, subIdx, hoursVal, minsVal) => {
        const h = Math.max(0, parseInt(hoursVal, 10) || 0);
        const m = Math.max(0, parseInt(minsVal, 10) || 0);
        const total = Math.max(1, h * 60 + m);
        handleSubStepChange(stepIdx, subIdx, 'durationMinutes', total);
      };

      const handleRemoveSubStep = (stepIdx, subIdx) => {
        setSteps(prev => prev.map((s, i) => {
          if (i !== stepIdx) return s;
          return { ...s, subSteps: (s.subSteps || []).filter((_, j) => j !== subIdx) };
        }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const cleanedSteps = steps.map((s, idx) => ({
          ...s,
          title: (s.title || '').trim() || `Step ${idx + 1}`,
          durationMinutes: Math.max(1, Number(s.durationMinutes) || 10),
          order: idx + 1,
          ovenAssignment: s.ovenAssignment || defaultOven || 'none',
          ovenTempC: s.ovenTempC ? Number(s.ovenTempC) : 200,
          endInstruction: (s.endInstruction || '').trim(),
          subSteps: (s.subSteps || []).map((sub, subIdx) => ({
            ...sub,
            title: (sub.title || '').trim() || `Sub-task ${subIdx + 1}`,
            durationMinutes: Math.max(1, Number(sub.durationMinutes) || 5)
          }))
        }));

        const finalCategory = isAddingCustomCat && customCatName.trim()
          ? customCatName.trim()
          : (category || 'Meat');

        onSave({
          ...component,
          name: name.trim() || 'Untitled Dish',
          category: finalCategory,
          color,
          soloOvenSlot,
          defaultOven,
          ingredients: ingredientsText.split('\n').map(s => s.trim()).filter(Boolean),
          notes: notes.trim(),
          steps: cleanedSteps
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-3 sm:p-4 overflow-y-auto">
          <form onSubmit={handleSubmit} className="w-full max-w-3xl bg-slate-900 border border-slate-700 rounded-2xl p-5 sm:p-6 space-y-5 shadow-2xl my-auto max-h-[92vh] flex flex-col">
            
            {/* Sticky Modal Top Header */}
            <div className="flex items-center justify-between border-b border-slate-800 pb-3 bg-slate-900 z-10 shrink-0">
              <div>
                <span className="text-xs font-mono uppercase text-orange-400">Component & Step Builder</span>
                <h3 className="font-bold text-lg text-white">{component.isNew ? 'Create New Dish Component' : `Edit "${component.name}"`}</h3>
              </div>
              <div className="flex items-center gap-2">
                <button
                  type="submit"
                  className="px-4 py-1.5 rounded-xl bg-orange-500 hover:bg-orange-400 text-slate-950 font-extrabold text-xs shadow"
                >
                  Save Dish
                </button>
                <button type="button" onClick={onClose} className="text-slate-400 hover:text-white p-1">
                  <Icon name="x" className="w-5 h-5" />
                </button>
              </div>
            </div>

            {/* Scrollable Content Body */}
            <div className="space-y-5 overflow-y-auto pr-1 flex-1">
              <div className="grid grid-cols-1 sm:grid-cols-12 gap-4">
                <div className="sm:col-span-5">
                  <label className="block text-xs font-mono uppercase text-slate-400 mb-1">Dish Name</label>
                  <input

                    value={name}

                    placeholder="e.g. Honey Glazed Parsnips"
                    className="w-full px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white"
                  />
                </div>

                <div className="sm:col-span-4">
                  <div className="flex items-center justify-between mb-1">
                    <label className="block text-xs font-mono uppercase text-slate-400">Category</label>
                    <button
                      type="button"
                      onClick={() => setIsAddingCustomCat(!isAddingCustomCat)}
                      className="text-[10px] font-mono text-orange-400 hover:underline"
                    >
                      {isAddingCustomCat ? 'Select Existing' : '+ New Category'}
                    </button>
                  </div>
                  {isAddingCustomCat ? (
                    <div className="flex gap-1.5">
                      <input
                        type="text"
                        value={customCatName}
                        onChange={e => setCustomCatName(e.target.value)}
                        placeholder="e.g. Stuffing"
                        className="flex-1 px-3 py-2 rounded-xl bg-slate-950 border border-orange-500 text-xs text-white"
                      />
                      <button
                        type="button"
                        onClick={handleCreateCustomCategory}
                        className="px-2.5 py-2 rounded-xl bg-orange-500 text-slate-950 font-bold text-xs"
                      >
                        Add
                      </button>
                    </div>
                  ) : (
                    <select

                    >
                      {availableCategories.map(cat => (

                    </select>

                </div>

                <div className="sm:col-span-3">
                  <label className="block text-xs font-mono uppercase text-slate-400 mb-1">Default Oven</label>
                  <select

                </div>

              <div>
