    // ============================================================================
    // WEB AUDIO WHOOSH SYNTHESIZER & AUTOPLAY UNLOCK
    // ============================================================================
    let sharedAudioCtx = null;
    let audioUnlocked = false;

    function getAudioContext() {
      if (!sharedAudioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) sharedAudioCtx = new AudioCtx();
      }
      if (sharedAudioCtx && sharedAudioCtx.state === 'suspended') {
        sharedAudioCtx.resume().catch(() => {});
      }
      return sharedAudioCtx;
    }

    function unlockAudio() {
      try {
        if ('audioSession' in navigator && navigator.audioSession) {
          navigator.audioSession.type = 'playback';
        }
        const ctx = getAudioContext();
        if (!ctx) return;

        if (ctx.state === 'suspended') {
          ctx.resume().catch(() => {});
        }

        if (!audioUnlocked) {
          const buffer = ctx.createBuffer(1, 1, 22050);
          const source = ctx.createBufferSource();
          source.buffer = buffer;
          source.connect(ctx.destination);
          source.start(0);
          audioUnlocked = true;
        }
      } catch (e) {
        console.warn("Audio unlock error:", e);
      }
    }

    ['pointerdown', 'touchend', 'keydown'].forEach(evt => {
      window.addEventListener(evt, unlockAudio, { passive: true });
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && sharedAudioCtx && sharedAudioCtx.state === 'suspended') {
        sharedAudioCtx.resume().catch(() => {});
      }
    });

    function playWhooshSound(enabled = true) {
      if (!enabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        
        const bufferSize = ctx.sampleRate * 0.25;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(300, now);
        filter.frequency.exponentialRampToValueAtTime(1200, now + 0.12);
        filter.frequency.exponentialRampToValueAtTime(200, now + 0.25);
        filter.Q.value = 3.0;

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.01, now);
        gain.gain.exponentialRampToValueAtTime(0.3, now + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        noise.start(now);
        noise.stop(now + 0.26);

        if (navigator.vibrate) {
          navigator.vibrate([60]);
        }
      } catch (e) {
        console.warn("Whoosh sound error:", e);
      }
    }

    function playKitchenAlarmChime(enabled = true) {
      if (!enabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        const playNote = (freq, startOffset, duration) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + startOffset);

          gain.gain.setValueAtTime(0.001, now + startOffset);
          gain.gain.exponentialRampToValueAtTime(0.22, now + startOffset + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, now + startOffset + duration);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + startOffset);
          osc.stop(now + startOffset + duration + 0.02);
        };

        playNote(523.25, 0, 0.28);
        playNote(659.25, 0.16, 0.28);
        playNote(1046.50, 0.32, 0.55);

        if (navigator.vibrate) {
          navigator.vibrate([120, 60, 180]);
        }
      } catch (e) {
        console.warn("Alarm chime error:", e);
      }

    const TIME_24H_RE = /^([01]\d|2[0-3]):([0-5]\d)$/;
    const SERVE_RE = /\b(serve|serving|plate|plating)\b/i;

    function parseTimeToDate(timeStr) {
      const now = new Date();
      const raw = typeof timeStr === 'string' ? timeStr.trim() : '';
      const match = TIME_24H_RE.exec(raw);
      const hours = match ? parseInt(match[1], 10) : 14;
      const minutes = match ? parseInt(match[2], 10) : 30;
      return new Date(now.getFullYear(), now.getMonth(), now.getDate(), hours, minutes, 0, 0);
    }

    function formatTimeHHMM(dateObj) {
      if (!dateObj || isNaN(dateObj.getTime())) return '--:--';
      return dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });

    function buildOrderedStepsForComponent(comp) {
      const userSteps = [...(comp.steps || [])].sort((a, b) => (a.order || 0) - (b.order || 0));
      const hasServeStep = userSteps.some(s => SERVE_RE.test(s.title || ''));
      return hasServeStep ? userSteps : [
        ...userSteps,
        {
          id: `step-auto-serve-${comp.id}`,
          title: `Plate & Serve ${comp.name}`,
          durationMinutes: 2,
          order: userSteps.length + 1,

        }

    function ovenProfile(comp, session, ovenConfig) {
      const orderedSteps = buildOrderedStepsForComponent(comp);
      const stepDurations = orderedSteps.map(step => {
        const stepState = (session?.stepStates && session.stepStates[step.id]) || {};
        const durationExtras = Number(stepState.extraMinutes || 0);
        return Math.max(1, (Number(step.durationMinutes) || 0) + durationExtras);
      });

      const stepOvens = orderedSteps.map(step => {
        const stepState = (session?.stepStates && session.stepStates[step.id]) || {};
        const rawOven = stepState.ovenOverride || step.ovenAssignment || comp.defaultOven || 'none';
        return (rawOven === 'oven2' && !ovenConfig.oven2.enabled) ? 'oven1' : rawOven;
      });

      const totalMinutes = stepDurations.reduce((acc, d) => acc + d, 0);
      let firstOvenIdx = -1;
      let lastOvenIdx = -1;

      stepOvens.forEach((ov, idx) => {
        if (ov && ov !== 'none') {
          if (firstOvenIdx === -1) firstOvenIdx = idx;
          lastOvenIdx = idx;
        }
      });

      if (firstOvenIdx === -1) {
        return {
          orderedSteps,
          totalMinutes,
          hasOvenSteps: false,
          ovenSpanMinutes: 0,
          preOvenMinutes: totalMinutes,
          postOvenMinutes: 0
        };
      }

      let preOvenMinutes = 0;
      let ovenSpanMinutes = 0;
      let postOvenMinutes = 0;

      stepDurations.forEach((dur, idx) => {
        if (idx < firstOvenIdx) preOvenMinutes += dur;
        else if (idx <= lastOvenIdx) ovenSpanMinutes += dur;
        else postOvenMinutes += dur;
      });

      return {
        orderedSteps,
        totalMinutes,
        hasOvenSteps: true,
        ovenSpanMinutes,
        preOvenMinutes,
        postOvenMinutes
      };
    }

    function calculateSchedule(session, library) {
      if (!session || !session.selectedComponentIds) return { allSteps: [], soloSlotMinutes: 0, earliestStart: null, targetDate: parseTimeToDate('14:30') };

      const targetDate = parseTimeToDate(session.targetServeTime || '14:30');
      const ovenConfig = {
        ...DEFAULT_OVEN_CONFIG,
        ...(session.ovenConfig || {}),
        oven1: { ...DEFAULT_OVEN_CONFIG.oven1, ...(session.ovenConfig?.oven1 || {}) },
        oven2: { ...DEFAULT_OVEN_CONFIG.oven2, ...(session.ovenConfig?.oven2 || {}) }
      };

      const activeComponents = session.selectedComponentIds
        .map(id => library.find(c => c.id === id))
        .filter(Boolean);

      const profilesById = {};
      activeComponents.forEach(comp => {
        profilesById[comp.id] = ovenProfile(comp, session, ovenConfig);
      });

      const soloComponents = activeComponents.filter(c => c.soloOvenSlot);
      const soloSlotMinutes = soloComponents.reduce((maxSolo, comp) => {
        const prof = profilesById[comp.id];
        const slotWindow = prof.hasOvenSteps ? (prof.ovenSpanMinutes + prof.postOvenMinutes) : prof.totalMinutes;
        return Math.max(maxSolo, slotWindow);
      }, 0);

      const timelineSteps = [];
      let earliestStartMs = targetDate.getTime();

      activeComponents.forEach(comp => {
        const prof = profilesById[comp.id];
        const orderedSteps = prof.orderedSteps;
        const totalCompMinutes = prof.totalMinutes;

        // Shift non-solo oven dishes early only by the overlap needed so their last oven step clears before the solo oven slot begins
        const finishesEarlyByMinutes = (!comp.soloOvenSlot && prof.hasOvenSteps && soloSlotMinutes > 0)
          ? Math.max(0, soloSlotMinutes - prof.postOvenMinutes)
          : 0;

        const compBaseFinishMs = targetDate.getTime() - (finishesEarlyByMinutes * 60 * 1000);
        const compBaseStartMs = compBaseFinishMs - (totalCompMinutes * 60 * 1000);

        let cursorMs = compBaseStartMs;
        let cumulativeItemShiftMinutes = 0;

        orderedSteps.forEach((step, idx) => {
          const stepState = (session.stepStates && session.stepStates[step.id]) || {};
          const durationExtras = Number(stepState.extraMinutes || 0);
          const effectiveDuration = Math.max(1, (Number(step.durationMinutes) || 0) + durationExtras);

          const scheduledStartMs = cursorMs + (cumulativeItemShiftMinutes * 60 * 1000);
          const scheduledEndMs = scheduledStartMs + (effectiveDuration * 60 * 1000);

          if (scheduledStartMs < earliestStartMs) earliestStartMs = scheduledStartMs;

          const stepCascadeShift = Number(stepState.cascadeShiftMinutes || 0);

          const rawOven = stepState.ovenOverride || step.ovenAssignment || comp.defaultOven || 'none';
          const effectiveOven = (rawOven === 'oven2' && !ovenConfig.oven2.enabled) ? 'oven1' : rawOven;
          const stepTempC = step.ovenTempC || (effectiveOven === 'oven2' ? ovenConfig.oven2.tempC : ovenConfig.oven1.tempC);

          const calculatedSubSteps = (step.subSteps || []).map(sub => {
            const subDur = Number(sub.durationMinutes) || 0;
            const subEndMs = scheduledEndMs;
            const subStartMs = subEndMs - (subDur * 60 * 1000);
            const offsetFromParentStart = Math.max(0, effectiveDuration - subDur);
            return {
              ...sub,
              startTime: new Date(subStartMs),
              endTime: new Date(subEndMs),
              offsetMinutes: offsetFromParentStart,
              completed: Boolean(stepState.subStepCompleted && stepState.subStepCompleted[sub.id])
            };
          });

          timelineSteps.push({
            stepId: step.id,
            componentId: comp.id,
            componentName: comp.name,
            componentCategory: comp.category || 'Uncategorized',
            componentColor: comp.color || 'orange',
            soloOvenSlot: Boolean(comp.soloOvenSlot),
            stepOrder: idx + 1,
            totalStepsInComp: orderedSteps.length,
            title: step.title,
            baseDurationMinutes: Number(step.durationMinutes) || 0,
            effectiveDurationMinutes: effectiveDuration,
            extraMinutes: durationExtras,
            cascadeShiftMinutes: stepCascadeShift,
            upstreamShiftMinutes: cumulativeItemShiftMinutes,
            startTime: new Date(scheduledStartMs),
            endTime: new Date(scheduledEndMs),
            endInstruction: step.endInstruction || '',
            subSteps: calculatedSubSteps,
            ovenAssignment: effectiveOven,
            ovenTempC: stepTempC,
            isPreheatStep: false,
            completed: Boolean(stepState.completed),
            completedAtStr: stepState.completedAtStr || null,
            notifyOverride: stepState.notifyOverride !== undefined ? stepState.notifyOverride : null,
            alarmOverride: stepState.alarmOverride !== undefined ? stepState.alarmOverride : null,
            notifyLeadSecOverride: stepState.notifyLeadSecOverride !== undefined ? stepState.notifyLeadSecOverride : null,
            alarmLeadSecOverride: stepState.alarmLeadSecOverride !== undefined ? stepState.alarmLeadSecOverride : null
          });

          cursorMs += (Number(step.durationMinutes) || 0) * 60 * 1000;
          cumulativeItemShiftMinutes += durationExtras + stepCascadeShift;
        });
      });

      // Automatically generate Oven Preheat Steps (~30 mins adjustable before the first oven step for each enabled oven)
      const preheatLeadMins = Math.max(5, Number(ovenConfig.preheatLeadMinutes) || 30);

      ['oven1', 'oven2'].forEach(ovenKey => {
        const ov = ovenConfig[ovenKey];
        if (!ov || !ov.enabled) return;

        const stepsForThisOven = timelineSteps.filter(s => s.ovenAssignment === ovenKey);
        const anchorStep = stepsForThisOven.length > 0
          ? stepsForThisOven.reduce((earliest, s) => (s.startTime.getTime() < earliest.startTime.getTime() ? s : earliest), stepsForThisOven[0])
          : (ovenKey === 'oven1' && timelineSteps.length > 0
              ? timelineSteps.reduce((earliest, s) => (s.startTime.getTime() < earliest.startTime.getTime() ? s : earliest), timelineSteps[0])
              : null);

        if (anchorStep) {
          const preheatEndMs = anchorStep.startTime.getTime();
          const preheatStartMs = preheatEndMs - (preheatLeadMins * 60 * 1000);
          if (preheatStartMs < earliestStartMs) earliestStartMs = preheatStartMs;

          const preheatStepId = `step-auto-preheat-${ovenKey}`;
          const stepState = (session.stepStates && session.stepStates[preheatStepId]) || {};
          const neededTemp = anchorStep.ovenTempC || ov.tempC || 200;
          const fanLabel = ov.fan ? ` (${neededTemp}°C Fan / ${neededTemp + 20}°C Conv)` : ` (${neededTemp}°C)`;

          timelineSteps.push({
            stepId: preheatStepId,
            componentId: `system-${ovenKey}`,
            componentName: `${ov.name || (ovenKey === 'oven1' ? 'Main Oven' : 'Second Oven')}`,
            componentCategory: 'System',
            componentColor: ovenKey === 'oven1' ? 'orange' : 'sky',
            soloOvenSlot: false,
            stepOrder: 1,
            totalStepsInComp: 1,
            title: `Preheat ${ov.name || (ovenKey === 'oven1' ? 'Main Oven' : 'Second Oven')} to ${neededTemp}°C${fanLabel}`,
            baseDurationMinutes: preheatLeadMins,
            effectiveDurationMinutes: preheatLeadMins,
            extraMinutes: 0,
            cascadeShiftMinutes: 0,
            upstreamShiftMinutes: 0,
            startTime: new Date(preheatStartMs),
            endTime: new Date(preheatEndMs),
            endInstruction: `${ov.name} ready at ${neededTemp}°C for ${anchorStep.componentName} (${anchorStep.title}).`,
            subSteps: [],
            ovenAssignment: ovenKey,
            ovenTempC: neededTemp,
            isPreheatStep: true,
            completed: Boolean(stepState.completed),
            completedAtStr: stepState.completedAtStr || null,
            notifyOverride: stepState.notifyOverride !== undefined ? stepState.notifyOverride : null,
            alarmOverride: stepState.alarmOverride !== undefined ? stepState.alarmOverride : null,
            notifyLeadSecOverride: stepState.notifyLeadSecOverride !== undefined ? stepState.notifyLeadSecOverride : null,
            alarmLeadSecOverride: stepState.alarmLeadSecOverride !== undefined ? stepState.alarmLeadSecOverride : null
          });
        }
      });

      timelineSteps.sort((a, b) => {
        const diff = a.startTime.getTime() - b.startTime.getTime();
        if (diff !== 0) return diff;
        if (a.isPreheatStep && !b.isPreheatStep) return -1;
        if (!a.isPreheatStep && b.isPreheatStep) return 1;
        return a.endTime.getTime() - b.endTime.getTime();
      });

      return {
        allSteps: timelineSteps,
        soloSlotMinutes,
        earliestStart: timelineSteps.length > 0 ? new Date(earliestStartMs) : null,
        targetDate,
        ovenConfig
      };
    }

    function Icon({ name, className = "w-5 h-5" }) {
      const ref = useRef(null);

      return <span ref={ref} className="inline-flex items-center justify-center shrink-0" />;

        </div>
      );
    }

    const pickNowStep = (steps) => (steps || []).find(s => !s.completed) || null;

    function fmtClock(totalSec) {
      const s = Math.max(0, Math.floor(totalSec));
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
      const pad = n => String(n).padStart(2, '0');
      return h > 0 ? `${h}:${pad(m)}:${pad(r)}` : `${pad(m)}:${pad(r)}`;
    }

    function useTapGuard(ms = 500) {
      const last = useRef(0);
      return useCallback((fn) => () => {
        const t = Date.now();
        if (t - last.current < ms) return;
        last.current = t;
        fn();
      }, [ms]);
    }

    const NOW_TONE = {
      upcoming: { border: 'border-orange-500', label: 'Starts in', clock: 'text-slate-50' },
      active:   { border: 'border-orange-500', label: 'Time left', clock: 'text-orange-400' },
      overdue:  { border: 'border-rose-500',   label: 'Overdue',   clock: 'text-rose-400' },
    };

    const FOCUS_RING = 'focus-visible:outline focus-visible:outline-4 focus-visible:outline-offset-2 focus-visible:outline-white';

    function NowBar({ nowMs, onDone, onLate, step }) {
      const guard = useTapGuard(500);

      if (!step) {
        return (
          <section aria-label="Current step" className="rounded-3xl border-2 border-emerald-500 bg-slate-900 p-4 text-center">
            <p className="text-2xl font-extrabold text-white">All steps done</p>
            <p className="text-sm text-slate-300">Plate up and enjoy your meal!</p>
          </section>
        );
      }

      const startMs = step.startTime.getTime();
      const endMs = step.endTime.getTime();
      const state = nowMs < startMs ? 'upcoming' : nowMs <= endMs ? 'active' : 'overdue';
      const secs =
        state === 'upcoming' ? (startMs - nowMs) / 1000 :
        state === 'active'   ? (endMs - nowMs) / 1000 :
                               (nowMs - endMs) / 1000;
      const tone = NOW_TONE[state];
      const usesOven = step.ovenAssignment && step.ovenAssignment !== 'none';
      const ovenText = usesOven
        ? `${step.ovenAssignment === 'oven2' ? 'Oven 2' : 'Oven 1'} at ${step.ovenTempC}°C`
        : null;

      return (
        <section aria-label="Current step" className={`rounded-3xl border-2 bg-slate-900 p-4 shadow-xl shadow-black/60 ${tone.border}`}>
          <div className="flex items-start justify-between gap-3">
            <div className="min-w-0">
              <p className="truncate text-base font-semibold text-slate-300">{step.componentName}</p>
              <p className="font-mono text-sm text-slate-300">
                {formatTimeHHMM(step.startTime)} to {formatTimeHHMM(step.endTime)}
              </p>
              {ovenText && (
                <span className="mt-1 inline-block rounded-lg border border-orange-500/50 bg-orange-500/15 px-2 py-0.5 text-xs font-semibold text-orange-200">
                  {ovenText}
                </span>
              )}
            </div>
            <div className="shrink-0 text-right">
              <p className="text-xs font-semibold text-slate-300">{tone.label}</p>
              <p className={`font-mono text-3xl font-extrabold leading-none tabular-nums sm:text-4xl ${tone.clock}`}>
                {state === 'overdue' ? '+' : ''}{fmtClock(secs)}
              </p>
            </div>
          </div>

          <h2 className="mt-2 line-clamp-3 break-words text-2xl font-extrabold leading-tight text-white">
            {step.title}
          </h2>

          {step.endInstruction && state !== 'upcoming' && (
            <p className="mt-1.5 line-clamp-2 text-sm text-slate-200">
              <span className="font-bold text-orange-400">Then: </span>{step.endInstruction}
            </p>
          )}

          <div className="mt-3 flex gap-2">
            <button
              type="button"
              onClick={guard(() => onDone(step))}
              aria-label={`Mark "${step.title}" done`}
              className={`min-h-[56px] flex-1 touch-manipulation rounded-2xl bg-orange-500 px-4 text-xl font-extrabold text-slate-950 active:bg-orange-300 ${FOCUS_RING}`}
            >
              ✓ Done
            </button>
            {state !== 'upcoming' && [5, 10].map(min => (
              <button
                key={min}
                type="button"
                onClick={guard(() => onLate(step, min))}
                aria-label={`Add ${min} minutes to "${step.title}"`}
                className={`min-h-[56px] min-w-[64px] touch-manipulation rounded-2xl border-2 border-slate-500 bg-slate-800 px-3 text-lg font-bold text-orange-300 active:bg-slate-700 ${FOCUS_RING}`}
              >
                +{min}m
              </button>
            ))}
          </div>
        </section>
      );
    }

    function CheckButton({ checked, onToggle, label }) {
      return (
        <button
          type="button"
          onClick={onToggle}

          aria-label={label}
          className="-ml-1.5 -mt-1.5 flex h-14 w-14 shrink-0 touch-manipulation items-center justify-center rounded-full active:bg-slate-800/70 focus-visible:outline focus-visible:outline-4 focus-visible:outline-white"

    function AlarmBanner({ alarm, onReplay, onDismiss }) {

      return (

          <div className="min-w-0 flex-1">
            <p className="text-xs font-semibold text-orange-300">{when}, due {formatTimeHHMM(step.startTime)}</p>
            <p className="line-clamp-2 break-words text-sm font-bold leading-snug text-white">

          <button

            className="flex min-h-[44px] min-w-[44px] touch-manipulation items-center justify-center rounded-xl bg-slate-800 text-orange-300 active:bg-slate-700"
          >
            <Icon name="volume-2" className="h-5 w-5" />
          </button>
          <button

            onClick={onDismiss}
            className="min-h-[44px] touch-manipulation rounded-xl bg-orange-500 px-4 text-sm font-extrabold text-slate-950 active:bg-orange-300"
          >
            Got it
          </button>
        </div>
      );
    }

        try { localStorage.setItem('roasttimer_updated_at', String(nowMs)); } catch {}
        const fb = window.__ROAST_FIREBASE__;
        if (!fb || !fb.db || !fb.auth?.currentUser || isApplyingRemoteRef.current) return;
        const normalizedPin = (stateRef.current.kitchenPin || 'ROAST1').trim().toUpperCase().replace(/[^A-Z0-9_-]/g, '');
        const kitchenDocRef = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'kitchens', normalizedPin);
        try {
          await fb.setDoc(kitchenDocRef, {
            kitchenPin: normalizedPin,
            sessionJson: JSON.stringify(nextSession ?? stateRef.current.session),
            libraryJson: JSON.stringify(nextLibrary ?? stateRef.current.library),
            presetsJson: JSON.stringify(nextPresets ?? stateRef.current.presets),
            categoriesJson: JSON.stringify(nextCategories ?? stateRef.current.categories),
            updatedAt: nowMs,
            updatedBy: fb.auth.currentUser.uid
          });
          setLastSyncedAt(new Date());
        } catch (e) {
          console.warn("Cloud push error:", e);
        }
      }, []);

      useEffect(() => {
        let unsubscribeSnapshot = null;
        async function setupFirebaseSync() {
          const fb = window.__ROAST_FIREBASE__;
          if (!fb || !fb.auth || !fb.db) {
            setSyncStatus('local');
            return;
          }
          try {
            setSyncStatus('connecting');
            if (!fb.auth.currentUser) {
              if (fb.initialToken) await fb.signInWithCustomToken(fb.auth, fb.initialToken);
              else await fb.signInAnonymously(fb.auth);
            }
            const user = fb.auth.currentUser;
            setCurrentUser(user);
            if (!user) { setSyncStatus('local'); return; }

            const normalizedPin = (kitchenPin || 'ROAST1').trim().toUpperCase().replace(/[^A-Z0-9_-]/g, '');
            const kitchenDocRef = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'kitchens', normalizedPin);

            unsubscribeSnapshot = fb.onSnapshot(kitchenDocRef, (snapshot) => {
              setSyncStatus('live');
              setLastSyncedAt(new Date());
              if (snapshot.exists()) {
                const data = snapshot.data();
                const remoteUpdatedAt = Number(data.updatedAt) || 0;
                const localUpdatedAt = Number(localStorage.getItem('roasttimer_updated_at')) || 0;

                if (data.updatedBy === user.uid && remoteUpdatedAt && (Date.now() - remoteUpdatedAt < 2500)) {
                  return;
                }
                if (Date.now() - Number(lastLocalMutationMsRef.current || 0) < 2500) {
                  return;
                }

                // If local storage has newer changes than the cloud (e.g. offline edits or old default cloud doc), push local to cloud!
                if (localUpdatedAt > remoteUpdatedAt) {
                  fb.setDoc(kitchenDocRef, {
                    kitchenPin: normalizedPin,
                    libraryJson: JSON.stringify(stateRef.current.library),
                    presetsJson: JSON.stringify(stateRef.current.presets),
                    sessionJson: JSON.stringify(stateRef.current.session),
                    categoriesJson: JSON.stringify(stateRef.current.categories),
                    updatedAt: localUpdatedAt,
                    updatedBy: user.uid
                  }).catch(() => {});
                  return;
                }

                isApplyingRemoteRef.current = true;
                if (data.libraryJson) try { setLibrary(JSON.parse(data.libraryJson)); } catch {}
                if (data.presetsJson) try { setPresets(JSON.parse(data.presetsJson)); } catch {}
                if (data.sessionJson) try { setSession(JSON.parse(data.sessionJson)); } catch {}
                if (data.categoriesJson) try { setCategories(JSON.parse(data.categoriesJson)); } catch {}
                try { localStorage.setItem('roasttimer_updated_at', String(remoteUpdatedAt)); } catch {}
                setTimeout(() => { isApplyingRemoteRef.current = false; }, 150);
              } else {
                const nowMs = Date.now();
                try { localStorage.setItem('roasttimer_updated_at', String(nowMs)); } catch {}
                fb.setDoc(kitchenDocRef, {
                  kitchenPin: normalizedPin,
                  libraryJson: JSON.stringify(stateRef.current.library),
                  presetsJson: JSON.stringify(stateRef.current.presets),
                  sessionJson: JSON.stringify(stateRef.current.session),
                  categoriesJson: JSON.stringify(stateRef.current.categories),
                  updatedAt: nowMs,
                  updatedBy: user.uid
                }).catch(() => {});
              }
            }, () => setSyncStatus('local'));
          } catch { setSyncStatus('local'); }
        }

        if (window.__ROAST_FIREBASE__) setupFirebaseSync();
        else {
          const handleReady = () => setupFirebaseSync();
          window.addEventListener('roast-firebase-ready', handleReady);
          return () => window.removeEventListener('roast-firebase-ready', handleReady);
        }
        return () => { if (unsubscribeSnapshot) unsubscribeSnapshot(); };
      }, [kitchenPin]);

      const updateSession = useCallback((updater) => {
        setSession(prev => {
          const next = typeof updater === 'function' ? updater(prev) : updater;
          stateRef.current.session = next;
          try { localStorage.setItem('roasttimer_session', JSON.stringify(next)); } catch {}
          pushStateToCloud(next, stateRef.current.library, stateRef.current.presets, stateRef.current.categories);
          return next;
        });
      }, [pushStateToCloud]);

      const updateLibrary = useCallback((updater) => {
        setLibrary(prev => {
          const next = typeof updater === 'function' ? updater(prev) : updater;
          stateRef.current.library = next;
          try { localStorage.setItem('roasttimer_library', JSON.stringify(next)); } catch {}
          pushStateToCloud(stateRef.current.session, next, stateRef.current.presets, stateRef.current.categories);
          return next;
        });
      }, [pushStateToCloud]);

      const updatePresets = useCallback((updater) => {
        setPresets(prev => {
          const next = typeof updater === 'function' ? updater(prev) : updater;
          stateRef.current.presets = next;
          try { localStorage.setItem('roasttimer_presets', JSON.stringify(next)); } catch {}
          pushStateToCloud(stateRef.current.session, stateRef.current.library, next, stateRef.current.categories);
          return next;
        });
      }, [pushStateToCloud]);

      const updateCategories = useCallback((updater) => {
        setCategories(prev => {
          const next = typeof updater === 'function' ? updater(prev) : updater;
          stateRef.current.categories = next;
          try { localStorage.setItem('roasttimer_categories', JSON.stringify(next)); } catch {}
          pushStateToCloud(stateRef.current.session, stateRef.current.library, stateRef.current.presets, next);
          return next;
        });
      }, [pushStateToCloud]);

      // Permanently wipe built-in sample dishes & sample presets while preserving custom ones
      const handleRemoveBuiltInDefaults = () => {
        const nextLibrary = stateRef.current.library.filter(c => !DEFAULT_SAMPLE_IDS.includes(c.id));
        const nextPresets = stateRef.current.presets.filter(p => p.id !== 'preset-sunday-beef' && p.id !== 'preset-christmas-feast');
        const nextSelectedIds = (stateRef.current.session.selectedComponentIds || []).filter(id => !DEFAULT_SAMPLE_IDS.includes(id));
        const nextSession = {
          ...stateRef.current.session,
          mealName: stateRef.current.session.mealName === 'Classic Sunday Beef Roast' ? 'My Roast Dinner' : stateRef.current.session.mealName,
          selectedComponentIds: nextSelectedIds
        };

        stateRef.current.library = nextLibrary;
        stateRef.current.presets = nextPresets;
        stateRef.current.session = nextSession;

        setLibrary(nextLibrary);
        setPresets(nextPresets);
        setSession(nextSession);

        try {
          localStorage.setItem('roasttimer_library', JSON.stringify(nextLibrary));
          localStorage.setItem('roasttimer_presets', JSON.stringify(nextPresets));
          localStorage.setItem('roasttimer_session', JSON.stringify(nextSession));
        } catch {}

        pushStateToCloud(nextSession, nextLibrary, nextPresets, stateRef.current.categories);
        showToast('Permanently removed all default sample dishes & presets!');
      };

      const handleExportBackup = () => {
        const payload = {
          version: 3,
          exportedAt: new Date().toISOString(),
          categories: stateRef.current.categories,
          library: stateRef.current.library,
          presets: stateRef.current.presets,
          session: stateRef.current.session
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `roasttimer-backup-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Downloaded JSON backup of all dishes, categories & meals');
      };

      const handleImportBackup = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            const nextCats = Array.isArray(parsed.categories) ? parsed.categories : stateRef.current.categories;
            const nextLib = Array.isArray(parsed.library) ? parsed.library : stateRef.current.library;
            const nextPre = Array.isArray(parsed.presets) ? parsed.presets : stateRef.current.presets;
            const nextSes = parsed.session ? parsed.session : stateRef.current.session;

            stateRef.current.categories = nextCats;
            stateRef.current.library = nextLib;
            stateRef.current.presets = nextPre;
            stateRef.current.session = nextSes;

            setCategories(nextCats);
            setLibrary(nextLib);
            setPresets(nextPre);
            setSession(nextSes);

            pushStateToCloud(nextSes, nextLib, nextPre, nextCats);
            showToast('Restored dishes, categories, presets & session from backup!');
          } catch {
            showToast('Invalid backup file format');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const schedule = useMemo(() => calculateSchedule(session, library), [session, library]);

      useEffect(() => {
        const currentMs = now.getTime();
        const prevMs = prevNowRef.current;
        const deltaMs = currentMs - prevMs;
        prevNowRef.current = currentMs;

        if (Math.abs(deltaMs) > 15000) return;

        schedule.allSteps.forEach(step => {
          if (step.completed) return;

          const startMs = step.startTime.getTime();

          const notifyOn = step.notifyOverride !== null ? step.notifyOverride : alertSettings.notificationsEnabled;
          const notifyLeadSec = step.notifyLeadSecOverride !== null ? step.notifyLeadSecOverride : alertSettings.notificationLeadSeconds;
          const notifyTriggerMs = startMs - (notifyLeadSec * 1000);
          const notifyKey = `notify-${step.stepId}-${notifyLeadSec}-${startMs}`;

          if (notifyOn && !firedAlertsRef.current[notifyKey]) {
            if (prevMs < notifyTriggerMs && currentMs >= notifyTriggerMs) {
              firedAlertsRef.current[notifyKey] = true;
              setActiveNotificationAlert({
                step,
                leadSeconds: notifyLeadSec,
                style: alertSettings.notificationStyle || 'fullscreen',
                triggeredAt: new Date(currentMs)
              });
            }
          }

          const alarmOn = step.alarmOverride !== null ? step.alarmOverride : alertSettings.alarmEnabled;
          const alarmLeadSec = step.alarmLeadSecOverride !== null ? step.alarmLeadSecOverride : alertSettings.alarmLeadSeconds;
          const alarmTriggerMs = startMs - (alarmLeadSec * 1000);
          const alarmKey = `alarm-${step.stepId}-${alarmLeadSec}-${startMs}`;

          if (alarmOn && !firedAlertsRef.current[alarmKey]) {
            if (prevMs < alarmTriggerMs && currentMs >= alarmTriggerMs) {
              firedAlertsRef.current[alarmKey] = true;
              playKitchenAlarmChime(true);
              setActiveAlarmBanner({
                step,
                leadSeconds: alarmLeadSec
              });
            }
          }
        });
      }, [now, schedule.allSteps, alertSettings]);

      const handleUpdateStepAlertConfig = useCallback((stepId, updates) => {
        updateSession(prev => {
          const cur = prev.stepStates?.[stepId] || {};
          return {
            ...prev,
            stepStates: {
              ...(prev.stepStates || {}),
              [stepId]: { ...cur, ...updates }
            }
          };
        });
      }, [updateSession]);

      const handleSwitchStepOven = useCallback((stepItem, nextOvenKey) => {
        updateSession(prev => {
          const cur = prev.stepStates?.[stepItem.stepId] || {};
          return {
            ...prev,
            stepStates: {
              ...(prev.stepStates || {}),
              [stepItem.stepId]: { ...cur, ovenOverride: nextOvenKey }
            }
          };
        });
        const label = nextOvenKey === 'oven1'
          ? (schedule.ovenConfig?.oven1?.name || 'Main Oven')
          : nextOvenKey === 'oven2'
          ? (schedule.ovenConfig?.oven2?.name || 'Second Oven')
          : 'No Oven / Hob';
        showToast(`Moved "${stepItem.title}" to ${label}`);
      }, [updateSession, schedule.ovenConfig, showToast]);

      const triggerTestNotificationAndAlarm = () => {
        const sampleStep = schedule.allSteps.find(s => !s.completed) || schedule.allSteps[0];
        if (!sampleStep) {
          showToast('Add a dish to test notifications');
          return;
        }
        if (alertSettings.alarmEnabled) {
          playKitchenAlarmChime(true);
          setActiveAlarmBanner({ step: sampleStep, leadSeconds: alertSettings.alarmLeadSeconds });
        }
        if (alertSettings.notificationsEnabled) {
          setActiveNotificationAlert({
            step: sampleStep,
            leadSeconds: alertSettings.notificationLeadSeconds,
            style: alertSettings.notificationStyle || 'fullscreen',
            triggeredAt: now
          });
        }
        if (!alertSettings.alarmEnabled && !alertSettings.notificationsEnabled) {
          showToast('Both Notification & Alarm are toggled OFF');
        }
      };

      useEffect(() => {
        let wakeLock = null;
        let cancelled = false;

        async function requestWakeLock() {
          if (cancelled || !keepScreenAwake || !('wakeLock' in navigator)) {
            if (!keepScreenAwake) setWakeLockActive(false);
            return;
          }
          if (document.visibilityState !== 'visible') return;
          try {
            if (wakeLock) {
              try { await wakeLock.release(); } catch {}
              wakeLock = null;
            }
            const lock = await navigator.wakeLock.request('screen');
            if (cancelled) {
              lock.release().catch(() => {});
              return;
            }
            wakeLock = lock;
            setWakeLockActive(true);
            wakeLock.addEventListener('release', () => {
              if (!cancelled) setWakeLockActive(false);
            });
          } catch {
            if (!cancelled) setWakeLockActive(false);
          }
        }

        const handleVisibilityChange = () => {
          if (document.visibilityState === 'visible' && keepScreenAwake) {
            requestWakeLock();
          }
        };

        requestWakeLock();
        document.addEventListener('visibilitychange', handleVisibilityChange);

        return () => {
          cancelled = true;
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          if (wakeLock) {
            wakeLock.release().catch(() => {});
            wakeLock = null;
          }
        };
      }, [keepScreenAwake]);

      const serveCountdown = useMemo(() => {
        const target = schedule.targetDate;
        const diffMs = target.getTime() - now.getTime();
        if (diffMs <= 0) return { isPast: true, formatted: '00:00:00' };
        const totalSeconds = Math.floor(diffMs / 1000);
        const hrs = Math.floor(totalSeconds / 3600);
        const mins = Math.floor((totalSeconds % 3600) / 60);
        const secs = totalSeconds % 60;
        const pad = n => String(n).padStart(2, '0');
        return { isPast: false, formatted: `${pad(hrs)}:${pad(mins)}:${pad(secs)}` };
      }, [schedule.targetDate, now]);

      const jumpToRoastStart = () => {
        if (!schedule.earliestStart) return;
        const diffMinutes = Math.round((schedule.earliestStart.getTime() - Date.now()) / 60000);
        setDemoTimeOffsetMinutes(diffMinutes);
        showToast(`Simulated clock set to roast start (${formatTimeHHMM(schedule.earliestStart)})`);
      };

      const handleToggleStepComplete = (stepItem, options = {}) => {
        const nextCompleted = !stepItem.completed;
        if (nextCompleted && !options.skipSound) {
          playWhooshSound(soundEnabled);
        }
        updateSession(prev => {
          const cur = prev.stepStates?.[stepItem.stepId] || {};
          return {
            ...prev,
            stepStates: {
              ...(prev.stepStates || {}),
              [stepItem.stepId]: {
                ...cur,
                completed: nextCompleted,
                completedAtStr: nextCompleted ? formatTimeHHMM(now) : null
              }
            }
          };
        });
      };

      const handleToggleSubStep = (stepId, subId) => {
        updateSession(prev => {
          const cur = prev.stepStates?.[stepId] || {};
          const curSubs = cur.subStepCompleted || {};
          const nextSubDone = !curSubs[subId];
          if (nextSubDone) {
            playWhooshSound(soundEnabled);
          }
          return {
            ...prev,
            stepStates: {
              ...(prev.stepStates || {}),
              [stepId]: {
                ...cur,
                subStepCompleted: { ...curSubs, [subId]: nextSubDone }
              }
            }
          };
        });
      };

      const handleAdjustStepDuration = (stepItem, deltaMinutes) => {
        updateSession(prev => {
          const cur = prev.stepStates?.[stepItem.stepId] || {};
          return {
            ...prev,
            stepStates: {
              ...(prev.stepStates || {}),
              [stepItem.stepId]: {
                ...cur,
                extraMinutes: (Number(cur.extraMinutes) || 0) + deltaMinutes
              }
            }
          };
        });
        showToast(`Adjusted "${stepItem.title}" by ${deltaMinutes > 0 ? '+' : ''}${deltaMinutes}m`);
      };

      const handleApplyCascadeChoice = (stepItem, delayMins, mode) => {
        if (mode === 'item_only') {
          updateSession(prev => {
            const cur = prev.stepStates?.[stepItem.stepId] || {};
            return {
              ...prev,
              stepStates: {
                ...(prev.stepStates || {}),
                [stepItem.stepId]: {
                  ...cur,
                  cascadeShiftMinutes: (Number(cur.cascadeShiftMinutes) || 0) + delayMins
                }
              }
            };
          });
          showToast(`Shifted subsequent steps for ${stepItem.componentName} by ${delayMins > 0 ? '+' : ''}${delayMins}m`);
        } else if (mode === 'no_shift') {
          updateSession(prev => {
            const cur = prev.stepStates?.[stepItem.stepId] || {};
            return {
              ...prev,
              stepStates: {
                ...(prev.stepStates || {}),
                [stepItem.stepId]: { ...cur, cascadeShiftMinutes: 0 }
              }
            };
          });
          showToast(`Kept subsequent steps fixed (catch-up mode)`);
        } else if (mode === 'global_shift') {
          const curTarget = parseTimeToDate(session.targetServeTime || '14:30');
          const nextTarget = new Date(curTarget.getTime() + delayMins * 60 * 1000);
          const nextTimeStr = formatTimeHHMM(nextTarget);
          updateSession(prev => ({ ...prev, targetServeTime: nextTimeStr }));
          showToast(`Shifted entire meal Target Serve Time to ${nextTimeStr}`);
        }
        setCascadePromptStep(null);
      };

      const isolatedStep = useMemo(() => {
        if (!isolatedStepId) return null;
        return schedule.allSteps.find(s => s.stepId === isolatedStepId) || null;
      }, [isolatedStepId, schedule.allSteps]);

      const hasAnySampleDishes = useMemo(() => {
        return library.some(c => DEFAULT_SAMPLE_IDS.includes(c.id));
      }, [library]);

      // Group library items by category for the Burger Menu Multi-Select Dropdown
      const groupedBurgerDishes = useMemo(() => {
        const q = burgerDishSearch.trim().toLowerCase();
        const filtered = library.filter(comp => {
          if (!q) return true;
          return (comp.name || '').toLowerCase().includes(q) || (comp.category || '').toLowerCase().includes(q);
        });
        const map = {};
        filtered.forEach(comp => {
          const cat = comp.category || 'Uncategorized';
          if (!map[cat]) map[cat] = [];
          map[cat].push(comp);
        });
        return Object.entries(map);
      }, [library, burgerDishSearch]);

      return (
        <div className="min-h-screen flex flex-col bg-[#090d16] text-slate-100 pb-[calc(5rem+env(safe-area-inset-bottom))] md:pb-10">
          <header ref={appHeaderRef} className="sticky top-0 z-30 bg-[#090d16]/90 backdrop-blur-md border-b border-slate-800/60 pt-[env(safe-area-inset-top)]">
            <div className="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
              <div className="flex items-center gap-3 min-w-0">
                <button
                  onClick={() => setShowBurgerDrawer(true)}
                  className="p-2 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-200 hover:text-orange-400 transition shrink-0"
                  title="Open Kitchen Settings, Ovens, Dishes & Alerts"
                >
                  <Icon name="menu" className="w-5 h-5" />
                </button>
                <div className="min-w-0">
                  <div className="flex items-center gap-2">
                    <h1 className="font-bold text-base text-white truncate">{session.mealName}</h1>
                    <button
                      onClick={openDrawerAndFocusServeTime}
                      className="text-[11px] font-mono px-2.5 py-0.5 rounded-md bg-orange-500/15 hover:bg-orange-500/30 text-orange-400 border border-orange-500/30 transition shrink-0 flex items-center gap-1 cursor-pointer"
                      title="Click to edit Target Serve Time & Oven Settings"
                    >
                      <span>Serve {session.targetServeTime}</span>
                      <Icon name="edit-2" className="w-2.5 h-2.5" />
                    </button>
                  </div>
                  <p className="text-[11px] text-slate-400 font-mono">
                    {serveCountdown.isPast ? 'Ready to serve' : `Countdown -${serveCountdown.formatted}`}
                  </p>
                </div>
              </div>

              <nav className="hidden md:flex items-center bg-slate-900/90 p-1 rounded-xl border border-slate-800/80">
                <button
                  onClick={() => setActiveTab('live')}
                  className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold transition ${
                    activeTab === 'live' ? 'bg-orange-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  Live Steps
                </button>
                <button
                  onClick={() => setActiveTab('library')}
                  className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold transition ${
                    activeTab === 'library' ? 'bg-orange-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  Library ({library.length})
                </button>
                <button
                  onClick={() => setActiveTab('planner')}
                  className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold transition ${
                    activeTab === 'planner' ? 'bg-orange-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  Saved Meals
                </button>
              </nav>

              <div className="flex items-center gap-2 shrink-0">
                <button
                  onClick={() => { setPinInput(kitchenPin); setShowSyncModal(true); }}
                  className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs font-medium"
                  title="Kitchen Sync PIN"
                >
                  <span className={`w-2 h-2 rounded-full ${syncStatus === 'live' ? 'bg-orange-500' : 'bg-slate-500'}`} />
                  <span className="font-mono font-bold text-slate-300">{kitchenPin}</span>
                </button>
              </div>
            </div>
          </header>

          {(activeAlarmBanner || (activeTab === 'live' && schedule.allSteps.length > 0)) && (
            <StickyStack>
              <AlarmBanner
                alarm={activeAlarmBanner}
                onReplay={() => playKitchenAlarmChime(true)}
                onDismiss={() => setActiveAlarmBanner(null)}
              />
              {activeTab === 'live' && schedule.allSteps.length > 0 && (
                <NowBar
                  nowMs={now.getTime()}
                  step={pickNowStep(schedule.allSteps)}
                  onDone={handleToggleStepComplete}
                  onLate={handleAdjustStepDuration}
                />
              )}
            </StickyStack>
          )}

          {toastMessage && (
            <div className="fixed bottom-20 md:bottom-6 right-4 z-50 bg-slate-900 border border-orange-500/40 text-orange-200 px-4 py-2.5 rounded-xl shadow-2xl flex items-center gap-2 text-xs font-semibold">
              <Icon name="flame" className="w-4 h-4 text-orange-400" />
              <span>{toastMessage}</span>
            </div>
          )}

          <main className="flex-1 max-w-3xl w-full mx-auto px-4 py-5">
            {activeTab === 'live' && (
              <LiveStepsStream

                updateSession={updateSession}

                onIsolateStep={(step) => setIsolatedStepId(step.stepId)}

                onOpenBurgerDrawer={() => setShowBurgerDrawer(true)}

                alertSettings={alertSettings}
                setAlertSettings={setAlertSettings}
                onUpdateStepAlertConfig={handleUpdateStepAlertConfig}
                showToast={showToast}
              />
            )}

            {activeTab === 'library' && (
              <ItemsLibraryView

                    <button
                      onClick={() => { jumpToRoastStart(); setShowBurgerDrawer(false); }}
                      className="px-2.5 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs text-orange-300"
                    >
                      Simulate Roast Start
                    </button>
                    {demoTimeOffsetMinutes !== 0 && (
                      <button
                        onClick={() => { setDemoTimeOffsetMinutes(0); showToast('Reset to real-time clock'); }}
                        className="px-2.5 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs text-slate-300"
                      >
                        Real Clock
                      </button>
                    )}
                    <button
                      onClick={() => {
                        updateSession(prev => ({ ...prev, stepStates: {} }));
                        showToast('Reset all step checkboxes & delays');
                      }}
                      className="px-2.5 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs text-slate-300"
                    >
                      Reset Checkboxes
                    </button>
                  </div>
                </div>
              </div>

              <div className="pt-3 border-t border-slate-800 flex gap-2">
                <button
                  onClick={() => { setShowBurgerDrawer(false); setShowShoppingDrawer(true); }}
                  className="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200"
                >
                  Shopping List
                </button>
                <button
                  onClick={() => setShowBurgerDrawer(false)}
                  className="flex-1 py-2.5 rounded-xl bg-orange-500 hover:bg-orange-400 text-xs font-bold text-slate-950"
                >
                  Done
                </button>
              </div>
            </div>
          </div>

          <nav className="fixed bottom-0 inset-x-0 z-40 bg-[#090d16]/95 backdrop-blur-md border-t border-slate-800 flex md:hidden pb-[env(safe-area-inset-bottom)]">
            <button
              onClick={() => setActiveTab('live')}
              className={`flex-1 py-3 flex flex-col items-center justify-center gap-1 text-xs font-bold transition ${
                activeTab === 'live' ? 'text-orange-400' : 'text-slate-400'
              }`}
            >
              <Icon name="timer" className="w-5 h-5" />
              <span>Live Steps</span>
            </button>
            <button
              onClick={() => setActiveTab('library')}
              className={`flex-1 py-3 flex flex-col items-center justify-center gap-1 text-xs font-bold transition ${
                activeTab === 'library' ? 'text-orange-400' : 'text-slate-400'
              }`}
            >
              <Icon name="book-open" className="w-5 h-5" />
              <span>Library ({library.length})</span>
            </button>
            <button
              onClick={() => setActiveTab('planner')}
              className={`flex-1 py-3 flex flex-col items-center justify-center gap-1 text-xs font-bold transition ${
                activeTab === 'planner' ? 'text-orange-400' : 'text-slate-400'
              }`}
            >
              <Icon name="calendar-clock" className="w-5 h-5" />
              <span>Saved Meals</span>
            </button>
          </nav>

          {quickDrawerCompId && (
            <QuickDrawer
              componentId={quickDrawerCompId}
              library={library}
              onClose={() => setQuickDrawerCompId(null)}
              onEdit={(comp) => { setQuickDrawerCompId(null); setEditingComponent(comp); }}
            />
          )}

          {showShoppingDrawer && (
            <ConsolidatedShoppingDrawer session={session} library={library} onClose={() => setShowShoppingDrawer(false)} showToast={showToast} />
          )}

          {editingComponent && (
            <ComponentEditorModal
              component={editingComponent}
              categories={categories}
              onAddCategory={(newCat) => {
                const clean = newCat.trim();
                if (!clean) return;
                if (!stateRef.current.categories.includes(clean)) {
                  const nextCats = [...stateRef.current.categories, clean];
                  stateRef.current.categories = nextCats;
                  setCategories(nextCats);
                  try { localStorage.setItem('roasttimer_categories', JSON.stringify(nextCats)); } catch {}
                }
              }}
              onClose={() => setEditingComponent(null)}
              onSave={(saved) => {
                const isNewComp = Boolean(editingComponent.isNew);
                const nextLibrary = stateRef.current.library.some(c => c.id === saved.id)
                  ? stateRef.current.library.map(c => c.id === saved.id ? saved : c)
                  : [...stateRef.current.library, saved];

                const nextCategories = saved.category && !stateRef.current.categories.includes(saved.category)
                  ? [...stateRef.current.categories, saved.category]
                  : stateRef.current.categories;

                const nextSession = isNewComp
                  ? {
                      ...stateRef.current.session,
                      selectedComponentIds: Array.from(new Set([...(stateRef.current.session.selectedComponentIds || []), saved.id]))
                    }
                  : stateRef.current.session;

                stateRef.current.library = nextLibrary;
                stateRef.current.categories = nextCategories;
                stateRef.current.session = nextSession;

                setLibrary(nextLibrary);
                setCategories(nextCategories);
                if (isNewComp) setSession(nextSession);

                try {
                  localStorage.setItem('roasttimer_library', JSON.stringify(nextLibrary));
                  localStorage.setItem('roasttimer_categories', JSON.stringify(nextCategories));
                  localStorage.setItem('roasttimer_session', JSON.stringify(nextSession));
                } catch {}

                pushStateToCloud(nextSession, nextLibrary, stateRef.current.presets, nextCategories);

                setEditingComponent(null);
                showToast(`Saved "${saved.name}" (${saved.category || 'Uncategorized'})`);
              }}
            />
          )}

          {cascadePromptStep && (
            <CascadeDelayModal
              step={cascadePromptStep}
              targetServeTime={session.targetServeTime}
              onClose={() => setCascadePromptStep(null)}
              onApply={handleApplyCascadeChoice}
            />
          )}

          {isolatedStep && (
            <IsolateStepModal
              step={isolatedStep}
              now={now}
              onClose={() => setIsolatedStepId(null)}
              onToggleStepComplete={handleToggleStepComplete}
              onToggleSubStep={handleToggleSubStep}
              onAdjustStepDuration={handleAdjustStepDuration}
              onOpenQuickDrawer={(compId) => setQuickDrawerCompId(compId)}
              onOpenCascadeModal={(st) => setCascadePromptStep(st)}
            />
          )}

          {activeNotificationAlert && (
            activeNotificationAlert.style === 'popup' ? (
              <div className="fixed bottom-20 lg:bottom-6 left-4 right-4 sm:left-auto sm:right-6 sm:w-96 z-50 bg-slate-900 border-2 border-orange-500 rounded-2xl p-4 shadow-2xl space-y-3">
                <div className="flex items-start justify-between gap-2">
                  <div>
                    <span className="text-[10px] font-mono uppercase px-2 py-0.5 rounded bg-orange-500/20 text-orange-300 border border-orange-500/40 font-bold">
                      {activeNotificationAlert.leadSeconds === 0
                        ? `Due Now • ${formatTimeHHMM(activeNotificationAlert.step.startTime)}`
                        : `Up Next (${formatLeadTimeShort(activeNotificationAlert.leadSeconds)}) • ${formatTimeHHMM(activeNotificationAlert.step.startTime)}`}
                    </span>
                    <h4 className="font-extrabold text-base text-white mt-1.5">{activeNotificationAlert.step.componentName}</h4>
                    <p className="text-xs text-slate-200 font-medium mt-0.5">{activeNotificationAlert.step.title}</p>
                  </div>
                  <button onClick={() => setActiveNotificationAlert(null)} className="text-slate-400 hover:text-white p-1">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>
                <div className="flex items-center gap-2 pt-1">
                  <button
                    onClick={() => {
                      handleToggleStepComplete(activeNotificationAlert.step);
                      setActiveNotificationAlert(null);
                    }}
                    className="flex-1 py-2 rounded-xl bg-orange-500 hover:bg-orange-400 text-slate-950 font-extrabold text-xs"
                  >
                    Mark Step Done
                  </button>
                  <button
                    onClick={() => setActiveNotificationAlert(null)}
                    className="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs"
                  >
                    Got It
                  </button>
                </div>
              </div>
            ) : (
              <div className="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex items-center justify-center p-4">
                <div className="max-w-lg w-full bg-slate-900 border-2 border-orange-500 rounded-3xl p-6 sm:p-8 text-center space-y-6 shadow-2xl">
                  <div className="w-16 h-16 rounded-2xl bg-orange-500 text-slate-950 flex items-center justify-center mx-auto shadow-lg shadow-orange-500/30">
                    <Icon name="bell-ring" className="w-9 h-9" />
                  </div>

                  <div className="space-y-2">
                    <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-orange-500/20 border border-orange-500/40 text-orange-300 font-mono text-xs font-bold uppercase">
                      <span>
                        {activeNotificationAlert.leadSeconds === 0
                          ? `Step Starting Now (${formatTimeHHMM(activeNotificationAlert.step.startTime)})`
                          : `Heads Up • ${formatLeadTimeShort(activeNotificationAlert.leadSeconds)} (${formatTimeHHMM(activeNotificationAlert.step.startTime)})`}
                      </span>
                    </div>
                    <div className="text-sm font-bold text-orange-400 pt-1">{activeNotificationAlert.step.componentName}</div>
                    <h2 className="text-2xl sm:text-3xl font-extrabold text-white leading-tight">
                      {activeNotificationAlert.step.title}
                    </h2>
                    <p className="text-xs font-mono text-slate-400">
                      Scheduled: {formatTimeHHMM(activeNotificationAlert.step.startTime)} – {formatTimeHHMM(activeNotificationAlert.step.endTime)} ({activeNotificationAlert.step.effectiveDurationMinutes} mins)
                    </p>
                  </div>

                  {activeNotificationAlert.step.endInstruction && (
                    <div className="p-3.5 rounded-2xl bg-slate-950 border border-slate-800 text-xs text-orange-200">
                      <strong>Then at end of step:</strong> {activeNotificationAlert.step.endInstruction}
                    </div>
                  )}

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                    <button
                      onClick={() => setActiveNotificationAlert(null)}
                      className="py-3.5 px-4 rounded-2xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-sm"
                    >
                      Acknowledge / Dismiss
                    </button>
                    <button
                      onClick={() => {
                        handleToggleStepComplete(activeNotificationAlert.step);
                        setActiveNotificationAlert(null);
                      }}
                      className="py-3.5 px-4 rounded-2xl bg-orange-500 hover:bg-orange-400 text-slate-950 font-extrabold text-sm shadow-lg shadow-orange-500/25"
                    >
                      ✓ Complete Step Now
                    </button>
                  </div>
                </div>
              </div>
            )
          )}

          {showSyncModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between">
                  <h3 className="font-bold text-lg text-white">Kitchen Sync PIN</h3>
                  <button onClick={() => setShowSyncModal(false)} className="text-slate-400 hover:text-white"><Icon name="x" className="w-5 h-5" /></button>
                </div>
                <p className="text-xs text-slate-300">Enter the same room PIN on your phone and laptop for instantaneous live two-way sync.</p>
                <input
                  type="text"
                  value={pinInput}
                  onChange={e => setPinInput(e.target.value.toUpperCase())}
                  className="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-700 font-mono font-bold text-lg text-orange-400 uppercase tracking-widest text-center"
                />
                <button
                  onClick={() => { setKitchenPin(pinInput || 'ROAST1'); setShowSyncModal(false); showToast(`Joined room ${pinInput}`); }}
                  className="w-full py-3 rounded-xl bg-orange-500 hover:bg-orange-400 text-slate-950 font-bold"
                >
                  Connect Kitchen PIN
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ============================================================================
    // LIVE STEPS STREAM
    // ============================================================================
    function LiveStepsStream({
      uiMode,
      setUiMode,
      session,
      updateSession,
      library,
      schedule,
      now,
      serveCountdown,
      onToggleStepComplete,
      onToggleSubStep,
      onAdjustStepDuration,
      onSwitchStepOven,
      onOpenCascadeModal,
      onIsolateStep,
      onOpenQuickDrawer,
      onOpenBurgerDrawer,
      onOpenServeTimeEditor,
      alertSettings,
      setAlertSettings,
      onUpdateStepAlertConfig,
      showToast
    }) {
      const [showCompleted, setShowCompleted] = useState(false);
      const [filterCompId, setFilterCompId] = useState('ALL');
      const [mergeSimultaneous, setMergeSimultaneous] = useState(true);
      const [showFilterPopover, setShowFilterPopover] = useState(false);
      const [openStepMenuId, setOpenStepMenuId] = useState(null);
      const [completingIds, setCompletingIds] = useState({});

      const triggerStepToggle = (step) => {
        if (!step.completed && !showCompleted) {
          if (completingIds[step.stepId]) return;
          playWhooshSound(
            (() => {
              try {
                const s = localStorage.getItem('roasttimer_sound');
                return s !== null ? JSON.parse(s) : true;
              } catch { return true; }
            })()
          );
          setCompletingIds(prev => ({ ...prev, [step.stepId]: true }));
          setTimeout(() => {
            onToggleStepComplete(step, { skipSound: true });
            setCompletingIds(prev => {
              const next = { ...prev };
              delete next[step.stepId];
              return next;
            });
          }, 460);
        } else {
          onToggleStepComplete(step);
        }
      };

      const triggerMergedGroupToggle = (stepsInGroup) => {
        const incompleteSteps = stepsInGroup.filter(s => !s.completed);
        if (incompleteSteps.length > 0 && !showCompleted) {
          playWhooshSound(
            (() => {
              try {
                const s = localStorage.getItem('roasttimer_sound');
                return s !== null ? JSON.parse(s) : true;
              } catch { return true; }
            })()
          );
          const nextCompleting = {};
          incompleteSteps.forEach(s => { nextCompleting[s.stepId] = true; });
          setCompletingIds(prev => ({ ...prev, ...nextCompleting }));
          setTimeout(() => {
            incompleteSteps.forEach(s => onToggleStepComplete(s, { skipSound: true }));
            setCompletingIds(prev => {
              const next = { ...prev };
              incompleteSteps.forEach(s => { delete next[s.stepId]; });
              return next;
            });
          }, 460);
        } else {
          stepsInGroup.forEach(s => onToggleStepComplete(s));
        }
      };

      const isMinimal = uiMode === 'minimal';
      const completedCount = schedule.allSteps.filter(s => s.completed).length;
      const totalCount = schedule.allSteps.length;
      const progressPct = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;

      const filteredSteps = useMemo(() => {
        return schedule.allSteps.filter(step => {
          if (filterCompId !== 'ALL' && step.componentId !== filterCompId) return false;
          if (!showCompleted && step.completed && !completingIds[step.stepId]) return false;
          return true;
        });
      }, [schedule.allSteps, filterCompId, showCompleted, completingIds]);

      const displayEntries = useMemo(() => {
        if (filterCompId !== 'ALL' || !mergeSimultaneous) {
          return filteredSteps.map(s => ({ type: 'single', key: s.stepId, step: s }));
        }
        const entries = [];
        let i = 0;
        while (i < filteredSteps.length) {
          const current = filteredSteps[i];
          if (current.isPreheatStep) {
            entries.push({ type: 'single', key: current.stepId, step: current });
            i++;
            continue;
          }
          const group = [current];
          let j = i + 1;
          while (
            j < filteredSteps.length &&
            !filteredSteps[j].isPreheatStep &&
            filteredSteps[j].startTime.getTime() === current.startTime.getTime()
          ) {
            group.push(filteredSteps[j]);
            j++;
          }
          if (group.length > 1) {
            entries.push({
              type: 'merged',
              key: 'merged-' + group.map(g => g.stepId).join('-'),
              startTime: current.startTime,
              endTime: new Date(Math.max(...group.map(g => g.endTime.getTime()))),
              steps: group
            });
          } else {
            entries.push({ type: 'single', key: current.stepId, step: current });
          }
          i = j;
        }
        return entries;
      }, [filteredSteps, filterCompId, mergeSimultaneous]);

      const activeComponents = useMemo(() => {
        return (session.selectedComponentIds || []).map(id => library.find(c => c.id === id)).filter(Boolean);
      }, [session.selectedComponentIds, library]);

      const formatOvenBadge = (step) => {
        if (!step.ovenAssignment || step.ovenAssignment === 'none') return null;
        const ov = step.ovenAssignment === 'oven2' ? schedule.ovenConfig?.oven2 : schedule.ovenConfig?.oven1;
        const name = ov?.name || (step.ovenAssignment === 'oven2' ? 'Second Oven' : 'Main Oven');
        const temp = step.ovenTempC || ov?.tempC || 200;
        return { name, temp, isOven2: step.ovenAssignment === 'oven2' };
      };

      return (
        <div className="space-y-4">
          <div className="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-4 sm:p-5 space-y-3">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-baseline gap-3">
                <span className="font-mono text-3xl sm:text-4xl font-extrabold text-orange-500 tracking-tight">
                  {serveCountdown.isPast ? 'SERVE' : `-${serveCountdown.formatted}`}
                </span>
                <button
                  onClick={onOpenServeTimeEditor}
                  className="text-xs font-mono text-slate-400 hover:text-orange-300 transition underline decoration-slate-700 underline-offset-4"
                  title="Click to adjust Target Serve Time & Ovens"
                >
                  Target {session.targetServeTime} • {completedCount}/{totalCount} done
                </button>
              </div>

              <div className="flex items-center gap-2">
                {filterCompId !== 'ALL' && (
                  <button
                    onClick={() => setFilterCompId('ALL')}
                    className="px-2.5 py-1.5 rounded-xl text-xs font-medium bg-orange-500/20 border border-orange-500/40 text-orange-300 flex items-center gap-1"
                  >
                    <span>Showing 1 Dish</span>
                    <Icon name="x" className="w-3 h-3" />
                  </button>
                )}

                <button
                  onClick={() => setShowCompleted(!showCompleted)}
                  className={`px-3 py-1.5 rounded-xl text-xs font-medium border transition ${
                    showCompleted
                      ? 'bg-orange-500/15 border-orange-500/40 text-orange-300'
                      : 'bg-slate-950 border-slate-800 text-slate-400 hover:text-slate-200'
                  }`}
                >
                  {showCompleted ? `Hide Done (${completedCount})` : `Done (${completedCount})`}
                </button>

                <div className="relative">
                  <button
                    onClick={() => setShowFilterPopover(!showFilterPopover)}
                    className={`px-3 py-1.5 rounded-xl text-xs font-medium border flex items-center gap-1.5 transition ${
                      filterCompId !== 'ALL'
                        ? 'bg-orange-500/15 border-orange-500/40 text-orange-300'
                        : 'bg-slate-950 border-slate-800 text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    <Icon name="sliders-horizontal" className="w-3.5 h-3.5" />
                    <span>{filterCompId === 'ALL' ? 'View & Filter' : 'Filtered'}</span>
                  </button>

                  {showFilterPopover && (
                    <div className="absolute right-0 mt-2 w-64 bg-slate-900 border border-slate-700 rounded-2xl p-3.5 shadow-2xl z-30 space-y-3">
                      <div className="flex items-center justify-between">
                        <span className="text-[11px] font-mono uppercase text-slate-400">Density</span>
                        <div className="flex bg-slate-950 p-0.5 rounded-lg border border-slate-800 text-xs">
                          <button
                            onClick={() => setUiMode('minimal')}
                            className={`px-2.5 py-1 rounded-md font-medium ${isMinimal ? 'bg-orange-500 text-slate-950 font-bold' : 'text-slate-400'}`}
                          >
                            Minimal
                          </button>
                          <button
                            onClick={() => setUiMode('technical')}
                            className={`px-2.5 py-1 rounded-md font-medium ${!isMinimal ? 'bg-orange-500 text-slate-950 font-bold' : 'text-slate-400'}`}
                          >
                            Detailed
                          </button>
                        </div>
                      </div>

                      <div className="flex items-center justify-between pt-2 border-t border-slate-800">
                        <span className="text-xs text-slate-300">Merge Simultaneous</span>
                        <button
                          onClick={() => setMergeSimultaneous(!mergeSimultaneous)}
                          className={`w-9 h-5 rounded-full transition p-0.5 ${mergeSimultaneous ? 'bg-orange-500' : 'bg-slate-800'}`}
                        >
                          <div className={`w-4 h-4 rounded-full bg-slate-950 transition transform ${mergeSimultaneous ? 'translate-x-4' : 'translate-x-0'}`} />
                        </button>
                      </div>

                      <div className="space-y-1.5 pt-2 border-t border-slate-800">
                        <span className="text-[11px] font-mono uppercase text-slate-400 block">Filter by Dish (Unmerges)</span>
                        <button
                          onClick={() => { setFilterCompId('ALL'); setShowFilterPopover(false); }}
                          className={`w-full text-left px-2.5 py-1.5 rounded-lg text-xs ${filterCompId === 'ALL' ? 'bg-orange-500/20 text-orange-300 font-semibold' : 'text-slate-300 hover:bg-slate-800'}`}
                        >
                          All Dishes ({schedule.allSteps.length})
                        </button>
                        {activeComponents.map(comp => (
                          <button
                            key={comp.id}
                            onClick={() => { setFilterCompId(comp.id); setShowFilterPopover(false); }}
                            className={`w-full text-left px-2.5 py-1.5 rounded-lg text-xs truncate ${filterCompId === comp.id ? 'bg-orange-500/20 text-orange-300 font-semibold' : 'text-slate-300 hover:bg-slate-800'}`}
                          >
                            {comp.name}
                          </button>
                        ))}
                      </div>

                      <div className="pt-2 border-t border-slate-800">
                        <button
                          onClick={() => { setShowFilterPopover(false); onOpenBurgerDrawer(); }}
                          className="w-full py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-orange-300 font-medium"
                        >
                          Ovens & Kitchen Settings...
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>

            <div className="w-full h-1 rounded-full bg-slate-950 overflow-hidden">
              <div className="h-full bg-orange-500 transition-all duration-300" style={{ width: `${progressPct}%` }} />
            </div>
          </div>

          <div className="space-y-2.5">
            {displayEntries.length === 0 ? (
              <div className="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-10 text-center space-y-2">
                <Icon name="check-circle" className="w-8 h-8 text-orange-400 mx-auto" />
                <h3 className="text-sm font-bold text-white">
                  {completedCount > 0 && !showCompleted ? 'All active steps completed!' : 'No steps scheduled.'}
                </h3>
                {completedCount > 0 && !showCompleted && (
                  <button
                    onClick={() => setShowCompleted(true)}
                    className="text-xs text-orange-400 hover:underline font-medium"
                  >
                    Show {completedCount} completed {completedCount === 1 ? 'step' : 'steps'}
                  </button>
                )}
              </div>
            ) : (
              displayEntries.map(entry => {
                if (entry.type === 'merged') {
                  const groupSteps = entry.steps;
                  const allGroupAnimating = groupSteps.every(s => completingIds[s.stepId]);
                  const allGroupCompleted = groupSteps.every(s => s.completed || completingIds[s.stepId]);
                  const nowMs = now.getTime();
                  const startMs = entry.startTime.getTime();
                  const endMs = entry.endTime.getTime();
                  const isInProgress = !allGroupCompleted && nowMs >= startMs && nowMs <= endMs;

                  return (
                    <div
                      key={entry.key}
                      className={`rounded-2xl border p-4 sm:p-5 transition-all overflow-hidden ${
                        allGroupAnimating
                          ? 'animate-completing-exit bg-orange-500/10 border-orange-500/40'
                          : allGroupCompleted
                          ? 'bg-slate-900/30 border-slate-800/40 opacity-45 animate-completed-steady'
                          : isInProgress
                          ? 'bg-slate-900 border-orange-500/60 shadow-lg shadow-orange-500/5'
                          : 'bg-slate-900/85 border-slate-800/90 hover:border-slate-700'
                      }`}
                    >
                      <div className="flex items-center justify-between gap-2 pb-3 mb-3 border-b border-slate-800/80">
                        <div className="flex flex-wrap items-center gap-1">
                          <CheckButton
                            checked={allGroupCompleted}
                            onToggle={() => triggerMergedGroupToggle(groupSteps)}
                            label={`Mark all ${groupSteps.length} simultaneous steps done`}
                          />
                          <span className="font-mono text-xs font-bold text-orange-400">
                            {formatTimeHHMM(entry.startTime)}
